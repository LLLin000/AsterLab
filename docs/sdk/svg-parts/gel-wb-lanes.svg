<svg viewBox="0 0 360 260" xmlns="http://www.w3.org/2000/svg">
  <!-- SDS-PAGE / Western Blot lane order schematic -->
  <rect x="64" y="42" width="232" height="172" rx="4" fill="#FAF9F7" stroke="currentColor" stroke-width="1.8"/>
  <!-- Lanes divider hints -->
  <line x1="122" y1="42" x2="122" y2="214" stroke="currentColor" stroke-width="0.6" stroke-dasharray="3 3" stroke-opacity="0.4"/>
  <line x1="180" y1="42" x2="180" y2="214" stroke="currentColor" stroke-width="0.6" stroke-dasharray="3 3" stroke-opacity="0.4"/>
  <line x1="238" y1="42" x2="238" y2="214" stroke="currentColor" stroke-width="0.6" stroke-dasharray="3 3" stroke-opacity="0.4"/>
  <!-- Marker ladder -->
  <rect x="76" y="64" width="34" height="5" rx="2" fill="#5B45C9"/>
  <rect x="76" y="92" width="34" height="5" rx="2" fill="#5B45C9"/>
  <rect x="76" y="128" width="34" height="6" rx="2" fill="#B45309"/>
  <rect x="76" y="172" width="34" height="5" rx="2" fill="#5B45C9"/>
  <!-- Target protein (~42 kDa) & housekeeping (~36 kDa) bands -->
  <rect x="134" y="126" width="34" height="5" rx="2" fill="#1C1B18" fill-opacity="0.45"/>
  <rect x="192" y="125" width="34" height="7" rx="2" fill="#1C1B18" fill-opacity="0.85"/>
  <rect x="250" y="124" width="34" height="8" rx="2" fill="#1C1B18"/>
  <rect x="134" y="171" width="34" height="6" rx="2" fill="#1C1B18" fill-opacity="0.85"/>
  <rect x="192" y="171" width="34" height="6" rx="2" fill="#1C1B18" fill-opacity="0.85"/>
  <rect x="250" y="171" width="34" height="6" rx="2" fill="#1C1B18" fill-opacity="0.85"/>
  <text x="93" y="30" font-size="11" text-anchor="middle">Marker</text>
  <text x="151" y="30" font-size="11" text-anchor="middle">对照</text>
  <text x="209" y="30" font-size="11" text-anchor="middle">低剂量</text>
  <text x="267" y="30" font-size="11" text-anchor="middle">高剂量</text>
  <text x="56" y="132" font-size="10" text-anchor="end">45 kDa</text>
  <text x="56" y="176" font-size="10" text-anchor="end">36 kDa</text>
  <text x="304" y="132" font-size="11" text-anchor="start">目的蛋白</text>
  <text x="304" y="176" font-size="11" text-anchor="start">GAPDH</text>
</svg>
