<svg viewBox="0 0 360 180" xmlns="http://www.w3.org/2000/svg">
  <!-- Polygon arrows (no <marker> dependency) + physical scalebar -->
  <rect x="24" y="28" width="88" height="36" rx="6" fill="#FAF9F7" stroke="currentColor" stroke-width="1.5"/>
  <line x1="112" y1="46" x2="160" y2="46" stroke="currentColor" stroke-width="1.8"/>
  <polygon points="168,46 158,41 158,51" fill="currentColor"/>
  <rect x="168" y="28" width="88" height="36" rx="6" fill="#F3F0FF" stroke="#5B45C9" stroke-width="1.5"/>
  <text x="68" y="50" font-size="11" text-anchor="middle">细胞接板</text>
  <text x="212" y="50" font-size="11" text-anchor="middle">加药孵育</text>

  <!-- 10 mm Scalebar at 1 mm = 2.4 px -> 24 px -->
  <line x1="286" y1="120" x2="310" y2="120" stroke="currentColor" stroke-width="2.5"/>
  <line x1="286" y1="115" x2="286" y2="125" stroke="currentColor" stroke-width="1.8"/>
  <line x1="310" y1="115" x2="310" y2="125" stroke="currentColor" stroke-width="1.8"/>
  <text x="298" y="142" font-size="10" text-anchor="middle">10 mm</text>
</svg>
