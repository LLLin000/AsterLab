    <circle cx="0" cy="0" r="108" fill="none" stroke="currentColor" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="102" fill="#F8F7F4" fill-opacity="0.55" stroke="currentColor" stroke-width="1.0" stroke-dasharray="4 4"/>
    <line x1="-102" y1="0" x2="102" y2="0" stroke="currentColor" stroke-width="1.0" stroke-dasharray="6 4" stroke-opacity="0.6"/>
    <line x1="0" y1="-102" x2="0" y2="102" stroke="currentColor" stroke-width="1.0" stroke-dasharray="6 4" stroke-opacity="0.6"/>
  </g>
  <text x="180" y="266" font-size="11" text-anchor="middle">90 mm 琼脂培养皿（1 mm = 2.4 px）</text>
