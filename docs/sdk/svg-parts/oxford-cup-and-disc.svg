<svg viewBox="0 0 360 220" xmlns="http://www.w3.org/2000/svg">
  <!-- 6 mm filter disc (r=7.2) vs 8 mm Oxford cup (outer r=9.6, inner r=6.0) -->
  <g transform="translate(110, 110)">
    <circle cx="0" cy="0" r="28" fill="#5B45C9" fill-opacity="0.08" stroke="#5B45C9" stroke-width="1.2" stroke-dasharray="3 3"/>
    <circle cx="0" cy="0" r="7.2" fill="#FFFFFF" stroke="currentColor" stroke-width="1.8"/>
  </g>
  <text x="110" y="168" font-size="11" text-anchor="middle">6 mm 药敏滤纸片 (r=7.2)</text>

  <g transform="translate(250, 110)">
    <circle cx="0" cy="0" r="32" fill="#2F7A4F" fill-opacity="0.08" stroke="#2F7A4F" stroke-width="1.2" stroke-dasharray="3 3"/>
    <circle cx="0" cy="0" r="9.6" fill="#E8ECEF" stroke="currentColor" stroke-width="1.8"/>
    <circle cx="0" cy="0" r="6.0" fill="#FFFFFF" stroke="currentColor" stroke-width="1.2"/>
  </g>
  <text x="250" y="168" font-size="11" text-anchor="middle">8 mm 牛津杯 (r=9.6/6.0)</text>
</svg>
