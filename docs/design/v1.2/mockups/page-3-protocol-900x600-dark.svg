<text x="836" y="122" font-family="var(--sans)" font-size="10" font-weight="600" fill="#55A76D" text-anchor="middle">版本 v1.2</text>
<text x="88" y="146" font-family="var(--sans)" font-size="11" fill="#A8A196">来源设计: L929 CCK-8 细胞毒性评价 · 固化日期: 2026-11-09 · 状态: 正式生效</text>
<rect x="72" y="182" width="812" height="30" rx="4" fill="#171614" stroke="#39352D" stroke-width="1"/>
<rect x="72" y="182" width="4" height="30" rx="2" fill="#4FA38D"/>
<text x="86" y="201" font-family="var(--sans)" font-size="11" fill="#F0EDE6">ℹ 本方案由实验设计 v1.2 固化生成。如需调整接种密度或孵育参数，请在“实验设计”中修改并发布新版本。</text>
<rect x="72" y="224" width="812" height="356" rx="8" fill="#201E1A" stroke="#39352D" stroke-width="1"/>
<text x="88" y="250" font-family="var(--sans)" font-size="13" font-weight="700" fill="#F0EDE6">步骤 04: 96 孔微孔板接种铺板 (Step Execution)</text>
<text x="88" y="274" font-family="var(--sans)" font-size="11" fill="#F0EDE6">1. 取预热好的 96 孔细胞培养板，标记实验组别及日期；</text>
<text x="88" y="292" font-family="var(--sans)" font-size="11" fill="#F0EDE6">2. 使用 Eppendorf 8 道移液器，轻柔吹吸混匀细胞悬液；</text>
<text x="88" y="310" font-family="var(--sans)" font-size="11" fill="#F0EDE6">3. 沿微孔侧壁每孔缓慢加入 100 µL 细胞悬液（接种密度为 10,000 cells/孔）；</text>
<text x="88" y="328" font-family="var(--sans)" font-size="11" fill="#F0EDE6">4. 接种完成后盖上板盖，十字交叉晃动混匀，严禁剧烈摇晃以防边缘效应。</text>
<text x="88" y="356" font-family="var(--sans)" font-size="12" font-weight="700" fill="#A8A196">质控与接受标准 (Quality Checks)</text>
<rect x="88" y="364" width="780" height="28" rx="4" fill="#201E1A" stroke="#39352D" stroke-width="1"/>
<text x="98" y="382" font-family="var(--sans)" font-size="11" fill="#F0EDE6">[✓] 设计前置校验: 96 孔板已完整绑定细胞浓度与梯度对照组</text>
<rect x="768" y="369" width="74" height="18" rx="3" fill="#171614" stroke="#39352D" stroke-width="1"/>
