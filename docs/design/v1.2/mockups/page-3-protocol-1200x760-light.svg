<text x="302" y="222" font-family="var(--sans)" font-size="13" font-weight="700" fill="#201E1A">步骤 04: 96 孔微孔板接种铺板 (Step Execution)</text>
<text x="302" y="246" font-family="var(--sans)" font-size="11" fill="#201E1A">1. 取预热好的 96 孔细胞培养板，标记实验组别及日期；</text>
<text x="302" y="264" font-family="var(--sans)" font-size="11" fill="#201E1A">2. 使用 Eppendorf 8 道移液器，轻柔吹吸混匀细胞悬液；</text>
<text x="302" y="282" font-family="var(--sans)" font-size="11" fill="#201E1A">3. 沿微孔侧壁每孔缓慢加入 100 µL 细胞悬液（接种密度为 10,000 cells/孔）；</text>
<text x="302" y="300" font-family="var(--sans)" font-size="11" fill="#201E1A">4. 接种完成后盖上板盖，十字交叉晃动混匀，严禁剧烈摇晃以防边缘效应。</text>
