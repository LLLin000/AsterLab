<text x="302" y="94" font-family="var(--sans)" font-size="16" font-weight="700" fill="#201E1A">L929 细胞微孔板接种与培养操作规程 (SOP-CCK8-01)</text>
<rect x="1100" y="80" width="64" height="20" rx="4" fill="#EAF5EE"/>
<text x="1132" y="94" font-family="var(--sans)" font-size="10" font-weight="600" fill="#2F7D4A" text-anchor="middle">版本 v1.2</text>
<text x="302" y="118" font-family="var(--sans)" font-size="11" fill="#6F6A60">来源设计: L929 CCK-8 细胞毒性评价 · 固化日期: 2026-11-09 · 状态: 正式生效</text>
<rect x="286" y="156" width="894" height="32" rx="4" fill="#F6F4EF" stroke="#DDD7CC" stroke-width="1"/>
<rect x="286" y="156" width="4" height="32" rx="2" fill="#1F6F5F"/>
<text x="300" y="176" font-family="var(--sans)" font-size="11" fill="#201E1A">ℹ 本方案由实验设计 v1.2 固化生成。如需调整接种密度或孵育参数，请在“实验设计”中修改并发布新版本。</text>
<rect x="286" y="200" width="894" height="540" rx="8" fill="#FFFFFF" stroke="#DDD7CC" stroke-width="1"/>
<text x="302" y="226" font-family="var(--sans)" font-size="14" font-weight="700" fill="#201E1A">步骤 04: 96 孔微孔板接种铺板 (Step Execution)</text>
<text x="1060" y="226" font-family="var(--sans)" font-size="11" fill="#6F6A60">预计耗时: 15 分钟</text>
<text x="302" y="250" font-family="var(--sans)" font-size="11" fill="#201E1A">1. 取预热好的 96 孔细胞培养板，标记实验组别及日期；</text>
<text x="302" y="270" font-family="var(--sans)" font-size="11" fill="#201E1A">2. 使用 Eppendorf 8 道移液器，轻柔吹吸混匀细胞悬液；</text>
<text x="302" y="290" font-family="var(--sans)" font-size="11" fill="#201E1A">3. 沿微孔侧壁每孔缓慢加入 100 µL 细胞悬液（接种密度为 10,000 cells/孔）；</text>
<text x="302" y="310" font-family="var(--sans)" font-size="11" fill="#201E1A">4. 接种完成后盖上板盖，十字交叉晃动混匀，严禁剧烈摇晃以防边缘效应；</text>
<text x="302" y="330" font-family="var(--sans)" font-size="11" fill="#201E1A">5. 室温静置 15 分钟使细胞贴壁平铺，移入 37 °C、5% CO₂ 细胞培养箱孵育 24 小时。</text>
