[package]
name = "labworkbench-desktop"
version = "0.1.0"
edition = "2021"

[profile.dev]
debug = 0

[profile.test]
debug = 0

[[bin]]
name = "labworkbench-desktop"
path = "src/main.rs"

[dependencies]
asterlab-core = { path = "../../crates/asterlab-core" }
slint = { version = "=1.18.1", default-features = false, features = ["compat-1-18", "std", "accessibility", "backend-winit", "renderer-femtovg", "renderer-software"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = "1"

[build-dependencies]
slint-build = "=1.18.1"
