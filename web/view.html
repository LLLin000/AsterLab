<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>实验组件视图</title>
<style>
:root{color-scheme:light;--bg:#f4f5f8;--panel:#fff;--ink:#1d2026;--muted:#7a8290;--line:#e2e5ea;--accent:#5b6cff;--soft:#eef0ff;--canvas:#fbfbfd;--ok:#2f8f62}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,"Segoe UI","Microsoft YaHei",sans-serif}
.shell{height:100vh;display:grid;grid-template-columns:64px minmax(0,1fr);overflow:hidden}.rail{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:14px}.brand{width:32px;height:32px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px;letter-spacing:-.03em}.rail-nav{display:flex;flex-direction:column;gap:8px}.rail-item{width:44px;height:44px;padding:6px;border:0;background:transparent;border-radius:12px;display:grid;place-items:center;gap:2px;color:var(--muted)}.rail-item img{width:20px;height:20px;object-fit:contain}.rail-item span{font-size:9px}.rail-item:hover{background:var(--bg)}.rail-item.active{background:var(--soft);color:var(--accent)}main{padding:14px 18px 16px;min-width:0;min-height:0;display:flex;flex-direction:column;gap:10px;overflow:hidden}.topbar{display:flex;align-items:center;gap:14px;flex:0 0 auto}.topbar-title{min-width:180px}.view-open{display:flex;gap:6px;margin-left:auto;max-width:420px;flex:1}.topbar #status{margin-left:6px;min-width:110px;text-align:right}
h1{font-size:17px;margin:0}h2{font-size:14px;margin:0;color:var(--muted)}h3{font-size:13px;margin:0 0 8px}
input,button,textarea{font:inherit;color:inherit}input,textarea{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px}button{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:7px 10px;cursor:pointer}button.primary{background:var(--accent);color:#fff;border-color:transparent}button:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:7px}.muted{color:var(--muted);font-size:12px}.stack{display:flex;flex-direction:column;gap:7px}
.workspace{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 30px rgba(20,28,48,.06);overflow:hidden;display:flex;flex-direction:column;flex:0 0 360px;min-height:220px}
.workspace-head{padding:12px 16px 4px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.workspace-title{font-size:19px;font-weight:700;letter-spacing:-.01em}.workspace-sub{color:var(--muted);font-size:12px;margin-top:3px}.panel-kicker{font-size:11px;font-weight:650;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.toolbar{display:flex;justify-content:center;gap:4px;padding:2px 0 10px}.toolbar button{width:38px;height:34px;display:grid;place-items:center;border-radius:9px;background:transparent;border-color:transparent}.toolbar button:hover{background:var(--bg)}.toolbar button.active{background:var(--soft);color:var(--accent)}
.canvas-wrap{position:relative;flex:1;min-height:0;margin:0 12px 12px;border:1px solid var(--line);border-radius:14px;background:var(--canvas);overflow:hidden}
#canvas{display:block;width:100%;height:100%;min-height:0;touch-action:none;cursor:grab}
.splitter{height:12px;flex:0 0 12px;cursor:row-resize;display:grid;place-items:center;outline:none}.splitter span{width:52px;height:4px;border-radius:99px;background:var(--line)}.splitter:hover span,.splitter:focus span{background:var(--accent)}#canvas.hand{cursor:grab}#canvas.grabbing{cursor:grabbing}
.grid-dot{fill:#dfe3ea}.wnode{cursor:pointer}.wnode .node-bg{fill:#fff;stroke:#e1e4ea;stroke-width:1;filter:drop-shadow(0 2px 4px rgba(20,28,48,.06))}.wnode:hover .node-bg{stroke:#b9c0ca}.wnode.selected .node-bg{stroke:var(--accent);stroke-width:2}.wnode .glyph{fill:none;stroke:#222831;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.wnode .label{font-size:13px;font-weight:600;fill:var(--ink);text-anchor:middle}.wnode .kind{font-size:10px;fill:var(--muted);text-anchor:middle}
.edge{fill:none;stroke:#b9c0ca;stroke-width:1.4;marker-end:url(#arrow)}.empty{fill:var(--muted);font-size:13px;text-anchor:middle}
.zoom{position:absolute;right:14px;bottom:10px;font-size:11px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:3px 9px}
.crumbs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.crumb{background:var(--soft);border:0;border-radius:99px;padding:3px 9px;font-size:12px}.crumb-sep{color:var(--muted);font-size:11px}
.detail{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 30px rgba(20,28,48,.05);padding:14px 16px;flex:1 1 0;min-height:0;overflow:auto}.detail-head{display:flex;justify-content:space-between;align-items:start;gap:10px;margin-bottom:14px}.detail-title{font-size:18px;font-weight:700}.detail-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:26px}.param{display:flex;flex-direction:column;gap:2px;margin:8px 0}.param b{font-weight:550}.param span{color:var(--muted);font-size:12px}
.cards{position:relative;display:block;min-height:10px}.grid-sizer{width:calc(33.333% - 6px)}.card{width:calc(33.333% - 6px);margin-bottom:8px;box-sizing:border-box}.plate-card{width:calc(66.666% - 6px)}@media(max-width:1100px){.grid-sizer,.card{width:calc(50% - 5px)}.plate-card{width:100%}}@media(max-width:700px){.grid-sizer,.card,.plate-card{width:100%}}.plate{display:grid;gap:3px;margin:8px 0}.well{width:17px;height:17px;padding:0;border-radius:4px;border:1px solid var(--line);background:#f7f8fb;font-size:7px;color:var(--muted)}.well.assigned{background:#eef0ff;border-color:#c7cdfd;color:var(--ink)}.well.selected{background:var(--accent);border-color:var(--accent);color:#fff}.well:disabled{opacity:.25;cursor:default}.card{border:1px solid var(--line);border-radius:11px;padding:10px;background:#fff}.card h3{font-size:12px;margin:0 0 3px}.card .tag{font-size:10px;color:var(--muted)}.card button{margin-top:7px;padding:4px 8px;font-size:11px}
textarea{min-height:54px;resize:vertical}
table{border-collapse:collapse;width:100%;font-size:12px;margin-top:8px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:6px 4px}th{color:var(--muted);font-weight:500}.editable-table input{border:0;background:transparent;padding:3px 4px;border-radius:4px}.editable-table input:focus{background:var(--soft);outline:1px solid var(--accent)}.table-actions{margin-top:6px}.empty-card{font-size:12px;color:var(--muted);padding:10px 0}.md-preview{font-size:13px;line-height:1.65}.md-preview h1{font-size:17px}.md-preview h2{font-size:15px}.md-preview h3{font-size:13px}.md-preview code{background:var(--bg);padding:1px 4px;border-radius:4px}
#status{min-height:18px}.preview{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}.card-actions{display:inline-flex;gap:2px;float:right}.card-actions button{width:24px;height:24px;padding:0;border:0;background:transparent;color:var(--muted)}.library{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}.library h3{width:100%;margin:0 0 2px}.library button{font-size:12px;padding:4px 8px}.selection-detail{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.7}
@media(max-width:900px){.shell{grid-template-columns:56px minmax(0,1fr)}main{padding:10px}.topbar{flex-wrap:wrap}.view-open{max-width:none;order:3;flex-basis:100%;margin-left:0}.topbar #status{order:4;flex-basis:100%;text-align:left}.detail-grid{grid-template-columns:1fr}.workspace{flex-basis:300px;min-height:220px}}@media(max-width:600px){.rail-item span{display:none}.workspace{flex-basis:260px}}
</style>
</head>
<body>
<div class="shell">
<aside class="rail">
  <div class="brand" title="AsterLab">AL</div>
  <nav class="rail-nav" aria-label="主导航">
    <button class="rail-item active" title="实验设计" aria-label="实验设计"><img src="/icons/plate.svg" alt=""><span>设计</span></button>
    <button class="rail-item" title="实验运行" aria-label="实验运行"><img src="/icons/incubator.svg" alt=""><span>运行</span></button>
    <button class="rail-item" title="资料与工具" aria-label="资料与工具"><img src="/icons/flask.svg" alt=""><span>资料</span></button>
  </nav>
</aside>
<main>
  <header class="topbar">
    <div class="topbar-title">
      <div class="workspace-title" id="workspaceTitle">AsterLab / CCK-8 Assay</div>
      <div class="workspace-sub" id="workspaceSub">Protocol · View</div>
    </div>
    <div class="view-open">
      <input id="viewId" placeholder="View ID" aria-label="View ID">
      <button class="primary" id="openView">打开</button>
    </div>
    <div id="status" class="muted" role="status"></div>
  </header>
  <div class="crumbs" id="crumbs"></div>
  <section class="workspace" id="canvasPanel">
    <div class="workspace-head">
      <div>
        <div class="panel-kicker">实验设计流程</div>
        <div class="muted">受限流程：连线来自 View；科学顺序仍由 Protocol 决定。</div>
      </div>
      <div class="row">
        <button id="undo" title="撤销布局" disabled>↶</button>
        <button id="redo" title="重做布局" disabled>↷</button>
      </div>
    </div>
    <div class="toolbar" role="toolbar" aria-label="画布工具">
      <button id="selectTool" class="active" title="选择">↖</button>
      <button id="handTool" title="平移">✋</button>
      <button id="fit" title="适应屏幕">⤢</button>
      <button id="zoomIn" title="放大">＋</button>
      <button id="zoomOut" title="缩小">−</button>
    </div>
    <div class="canvas-wrap">
      <svg id="canvas" viewBox="0 0 1100 560" role="img" aria-label="实验流程画布"></svg>
      <div class="zoom" id="zoomLabel">100%</div>
    </div>
  </section>
  <div class="splitter" id="splitter" role="separator" aria-label="调整画布与详情高度" aria-orientation="horizontal" tabindex="0"><span></span></div>
  <section class="detail" id="detail"><div class="muted">选择一个步骤查看详情。</div></section>
</main>
</div>
<script src="/vendor/masonry.js"></script>
<script>
let viewId="", data=null, node=null, selected=null, stack=[], mode="select";
let view={x:0,y:0,k:1}, pan=null, dragNode=null, nodeMoved=false;
let history=[], future=[], saveChain=Promise.resolve();
let paramCache=new Map(), plateCache=new Map(), plateSelections=new Map();
let calcState={positions:"",volume:"",unit:"",extra:""};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const defName=c=>c?.definition?.id||"component";
const nodeTitle=c=>c?.props?.label||c?.props?.title||defName(c);
const scopeLabel=c=>c?.model_ref?.step?.scope?.assay_id?`assay: ${c.model_ref.step.scope.assay_id}`:"";
const workflowOf=c=>c?.workflow?.nodes||[];
const slotsOf=c=>c?.slots||{};
const findById=(root,id)=>{let hit=null;const walk=c=>{if(c.instance_id===id)hit=c;Object.values(c.slots||{}).flat().forEach(walk);(c.workflow?.nodes||[]).forEach(n=>walk(n.component))};walk(root);return hit};
let masonry=null;
function layoutCards(){
  const container=document.querySelector(".cards");if(!container)return;
  if(!window.Masonry){container.classList.add("no-masonry");return}
  if(masonry&&masonry.element!==container){masonry.destroy();masonry=null}
  if(!masonry)masonry=new Masonry(container,{itemSelector:".card",columnWidth:".grid-sizer",gutter:8,percentPosition:true,transitionDuration:0});
  else{masonry.reloadItems();masonry.layout()}
}

function iconFor(c){
  const visual=c?.visual||{};
  const explicit=(visual.symbol||visual.template||"").toLowerCase();
  const allowed=["plate","pipette","incubator","reader","flask"];
  let key=allowed.includes(explicit)?explicit:"flask";
  const def=defName(c);
  if(!allowed.includes(explicit)&&def==="lab.well_plate")key="plate";
  return `<image class="bioicon" href="/icons/${key}.svg" x="8" y="7" width="60" height="60" preserveAspectRatio="xMidYMid meet"/>`;
}
function renderCrumbs(){
  $("crumbs").innerHTML=stack.map((c,i)=>`<button class="crumb" data-i="${i}">${esc(nodeTitle(c))}</button>`).join('<span class="crumb-sep">›</span>');
  $("crumbs").querySelectorAll("button").forEach(b=>b.onclick=()=>{stack=stack.slice(0,Number(b.dataset.i)+1);node=stack[stack.length-1];selected=workflowOf(node)[0]?.component||node;render()});
}
function graph(){
  if(!node||!node.workflow)return {nodes:[],edges:[]};
  const nodes=node.workflow.nodes||[];
  const edges=node.workflow.edges||[];
  const gap=190, start=550-((nodes.length-1)*gap)/2-38, y=150;
  nodes.forEach((n,i)=>{const c=n.component;const v=c.visual||{};if(typeof v.x!=="number"){c._vx=start+i*gap;c._vy=y}else{c._vx=v.x;c._vy=v.y}});
  return {nodes,edges};
}
function nodeBox(c){return {x:c._vx??80,y:c._vy??175,w:76,h:76}}
function compactMarkup(c){
  return `<g class="glyph">${iconFor(c)}</g><text class="label" x="38" y="101">${esc(nodeTitle(c))}</text><text class="kind" x="38" y="116">${esc((c.visual?.symbol||c.visual?.template||"").trim()||defName(c))}</text>`;
}
function renderCanvas(){
  const svg=$("canvas"); const {nodes,edges}=graph();
  const byId={}; nodes.forEach(n=>{byId[n.node_id]=n.component;byId[n.component.instance_id]=n.component});
  const edgeMarkup=edges.map(e=>{const a=byId[e.from],b=byId[e.to];if(!a||!b)return "";const A=nodeBox(a),B=nodeBox(b);const x1=A.x+76,y1=A.y+38,x2=B.x,y2=B.y+38;const mid=x1+(x2-x1)/2;return `<path class="edge" d="M${x1} ${y1} C${mid} ${y1},${mid} ${y2},${x2-5} ${y2}"/>`}).join("");
  const nodeMarkup=nodes.map(n=>{const c=n.component,B=nodeBox(c);const active=selected?.instance_id===c.instance_id;const hint=(c.visual?.symbol||c.visual?.template||"").trim();return `<g class="wnode ${active?"selected":""}" data-node="${esc(c.instance_id)}" transform="translate(${B.x} ${B.y})" tabindex="0" role="button" aria-label="${esc(nodeTitle(c))}"><rect class="node-bg" width="76" height="76" rx="18"/>${compactMarkup(c)}</g>`}).join("");
  const empty=nodes.length?"":`<text class="empty" x="550" y="260">此 View 还没有工作流节点。</text>`;
  const dots=Array.from({length:16},(_,r)=>Array.from({length:24},(_,c)=>`<circle class="grid-dot" cx="${40+c*44}" cy="${40+r*34}" r="1"/>`).join("")).join("");
  svg.innerHTML=`<defs><pattern id="dots" width="44" height="34" patternUnits="userSpaceOnUse">${dots}</pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b9c0ca"/></marker></defs><rect width="1100" height="560" fill="url(#dots)"/><g id="viewport" transform="translate(${view.x} ${view.y}) scale(${view.k})">${edgeMarkup}${nodeMarkup}${empty}</g>`;
  svg.querySelectorAll(".wnode").forEach(el=>{
    el.addEventListener("pointerdown",ev=>startNodeDrag(ev,byId[el.dataset.node]));
    el.addEventListener("click",ev=>{ev.stopPropagation();if(nodeMoved){nodeMoved=false;return}selectComponent(byId[el.dataset.node])});
    el.addEventListener("dblclick",ev=>{ev.stopPropagation();const c=byId[el.dataset.node];if(c?.workflow?.nodes?.length){enterComponent(c)}});
  });
  $("zoomLabel").textContent=`${Math.round(view.k*100)}%`;
  updateHistoryButtons();
}
function updateHistoryButtons(){$("undo").disabled=history.length===0;$("redo").disabled=future.length===0}
function selectComponent(c){selected=c;renderCanvas();renderDetail()}
function enterComponent(c){node=c;stack.push(c);selected=workflowOf(c)[0]?.component||c;render()}
function fmtValue(value){if(value===null||value===undefined)return "待确认";if(typeof value==="object")return JSON.stringify(value);return String(value)}
async function loadParams(c,boxId){
  const ref=c?.model_ref||{};
  if(ref.kind!=="operation_use")return;
  const key=`${viewId}|${c.instance_id}`;
  let result=paramCache.get(key);
  if(!result){
    try{
      const r=await fetch(`/api/views/${encodeURIComponent(viewId)}/steps/${encodeURIComponent(c.instance_id)}`);
      const j=await r.json(); if(!r.ok)throw new Error(j.error||"参数读取失败"); result=j;
    }catch(e){result={error:String(e.message||e)}} paramCache.set(key,result)
  }
  if(selected?.instance_id!==c.instance_id)return;
  const box=$(boxId);if(!box)return;
  if(result.error){box.innerHTML=`<div class="muted">${esc(result.error)}</div>`;return}
  const step=result.step||{};
  const params=step.parameters||[];
  const unresolved=step.unresolved_parameter_refs||[];
  const rows=params.map(p=>{
    const label=p.label||p.key||p.slot||"参数";const unit=p.unit?` ${p.unit}`:"";
    const source=p.value_source||p.source||"";
    return `<div class="param"><b>${esc(label)}</b><span>${esc(fmtValue(p.value))}${esc(unit)}${source?" · "+esc(source):""}</span></div>`
  }).join("");
  const pending=unresolved.map(key=>{const item=(result.unresolved_parameters||[]).find(p=>p.slot===key||p.label===key)||{};return `<div class="param"><b>${esc(item.label||key)}</b><span>待确认${item.unit?" · "+esc(item.unit):""}</span></div>`}).join("");
  box.innerHTML=rows+pending||`<div class="muted">该步骤没有已解析参数。</div>`;
  layoutCards();
}
function fmtSelection(plate,instanceId){
  const assigned=new Map((plate.positions||[]).map(p=>[p.position_id,p]));
  const selected=plateSelections.get(instanceId)||new Set();
  const lines=[...selected].sort().map(id=>{const hit=assigned.get(id);const target=hit?.targets?.[0]?.target?.id||"未关联目标";return `${esc(id)} · ${esc(target)}`});
  return lines.join("<br>")||`<span class="muted">尚未选择孔位。选择不是 DesignVersion 修改。</span>`;
}
function plateMarkup(plate,instanceId){
  const assigned=new Map((plate.positions||[]).map(p=>[p.position_id,p]));
  const selected=plateSelections.get(instanceId)||new Set();
  const rowCount=Number(plate.rows), colCount=Number(plate.columns);
  if(!rowCount||!colCount)return `<div class="muted">Profile 几何未解析：${esc(plate.profile_id||"unknown")}</div>`;
  const rows=Array.from({length:rowCount},(_,i)=>String.fromCharCode(65+i));
  let html="";
  for(const row of rows)for(let col=1;col<=colCount;col++){
    const id=`${row}${col}`; const hit=assigned.get(id); const on=selected.has(id);
    const target=hit?.targets?.[0]?.target?.id||"";
    html+=`<button class="well ${hit?"assigned":""} ${on?"selected":""}" data-well="${id}" data-plate="${esc(instanceId)}" ${hit?"":"disabled"} title="${id}${hit?" · "+esc(target):" · 未分配"}">${id}</button>`
  }
  return `<div class="plate" style="grid-template-columns:repeat(${colCount},17px)">${html}</div><div class="muted">已选 ${selected.size} / 计划 ${assigned.size} 孔（选择不修改 DesignVersion）</div><div class="selection-detail">${fmtSelection(plate,instanceId)}</div>`;
}
function bindPlateBox(box,plate,instanceId){
  box.querySelectorAll(".well").forEach(btn=>btn.onclick=()=>toggleWell(instanceId,btn.dataset.well,plate,box.id));
}
function syncCalcPositions(){
  const setEl=$("calc-positions");if(setEl)setEl.value=calcState.positions;
}
async function loadPlate(instanceId,boxId){
  let plate=plateCache.get(instanceId);
  if(!plate){
    try{
      const r=await fetch(`/api/views/${encodeURIComponent(viewId)}/data?instance_id=${encodeURIComponent(instanceId)}`);
      const j=await r.json(); if(!r.ok)throw new Error(j.error||"孔位读取失败"); plate=(j.result??j).plate; plateCache.set(instanceId,plate);
    }catch(e){const box=$(boxId);if(box)box.innerHTML=`<div class="muted">${esc(e.message)}</div>`;return}
  }
  if(!plateSelections.has(instanceId))plateSelections.set(instanceId,new Set());
  const box=$(boxId);if(!box)return;box.innerHTML=plateMarkup(plate,instanceId);bindPlateBox(box,plate,instanceId);layoutCards();
}
function toggleWell(instanceId,well,plate,boxId){
  const set=plateSelections.get(instanceId)||new Set();if(set.has(well))set.delete(well);else set.add(well);plateSelections.set(instanceId,set);
  calcState.positions=[...set].sort().join(",");syncCalcPositions();
  const box=$(boxId);if(box){box.innerHTML=plateMarkup(plate,instanceId);bindPlateBox(box,plate,instanceId);layoutCards()}
}
function selectAllWells(instanceId,all){
  const plate=plateCache.get(instanceId);if(!plate)return;
  const set=all?new Set((plate.positions||[]).map(p=>p.position_id)):new Set();
  plateSelections.set(instanceId,set);calcState.positions=[...set].sort().join(",");syncCalcPositions();
  const box=$(`plate-body-${instanceId}`);if(box){box.innerHTML=plateMarkup(plate,instanceId);bindPlateBox(box,plate,instanceId);layoutCards()}
}
function renderMarkdown(text){
  const safe=esc(text||"");
  return safe.split(/\n{2,}/).map(block=>{
    const lines=block.split("\n").map(line=>{
      let out=esc(line);
      out=out.replace(/^###\s+(.+)$/,"<h3>$1</h3>").replace(/^##\s+(.+)$/,"<h2>$1</h2>").replace(/^#\s+(.+)$/,"<h1>$1</h1>");
      out=out.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/`([^`]+)`/g,"<code>$1</code>");
      return out;
    }).join("<br>");
    return `<p>${lines}</p>`;
  }).join("");
}
function tableColumns(child){
  const cols=Array.isArray(child.props?.columns)?child.props.columns:[];

  return Array.from({length:Math.max(1,width)},(_,i)=>`列 ${i+1}`);

let splitDrag=null;
splitHandle.addEventListener("pointerdown",e=>{
  splitDrag={y:e.clientY,h:canvasPanel.getBoundingClientRect().height};
  splitHandle.setPointerCapture(e.pointerId);document.body.style.cursor="row-resize";
});
splitHandle.addEventListener("pointermove",e=>{
  if(!splitDrag)return;setCanvasHeight(splitDrag.h+(e.clientY-splitDrag.y));renderCanvas();
});
splitHandle.addEventListener("pointerup",e=>{
  splitDrag=null;document.body.style.cursor="";splitHandle.releasePointerCapture?.(e.pointerId);layoutCards();
});
splitHandle.addEventListener("keydown",e=>{
  if(e.key!=="ArrowUp"&&e.key!=="ArrowDown")return;e.preventDefault();
  setCanvasHeight(canvasPanel.getBoundingClientRect().height+(e.key==="ArrowDown"?20:-20));renderCanvas();
});
window.addEventListener("resize",()=>{const h=canvasPanel.getBoundingClientRect().height;setCanvasHeight(h);renderCanvas();layoutCards()});
$("openView").onclick=load;
</script>
</body>
</html>
