<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>实验组件视图</title>
<link rel="stylesheet" href="/vendor/tabler/tabler.min.css">
<style>
:root{color-scheme:light;--bg:#f7f8fa;--panel:#fff;--ink:#202938;--muted:#667085;--line:#e4e7ec;--accent:#2563eb;--soft:#eff4ff;--canvas:#fbfcfe;--ok:#16803c}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 Inter,"Segoe UI","Microsoft YaHei",sans-serif}
.shell{height:100vh;display:grid;grid-template-columns:232px minmax(0,1fr);overflow:hidden}.rail{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px;gap:14px}.brand-row{display:flex;align-items:center;gap:9px;padding:0 6px}.brand-copy{display:flex;flex-direction:column;line-height:1.1}.brand-copy strong{font-size:13px}.brand-copy span{font-size:11px;color:var(--muted)}.project-picker{display:grid;gap:3px;padding:8px 6px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--muted);font-size:11px}.project-picker select{border:0;background:transparent;color:var(--ink);font-size:12px;padding:0}.rail-nav{display:flex;flex-direction:column;gap:4px}.rail-foot{margin-top:auto;padding:8px 6px;line-height:1.5}.brand{width:32px;height:32px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px;letter-spacing:-.03em}.rail-nav{display:flex;flex-direction:column;gap:8px}.rail-item{width:100%;height:38px;padding:0 8px;border:0;background:transparent;border-radius:8px;display:flex;align-items:center;gap:9px;color:var(--muted);text-align:left}.rail-item img{width:18px;height:18px;object-fit:contain}.rail-item span{font-size:13px}.rail-item:hover{background:var(--bg)}.rail-item.active{background:var(--soft);color:var(--accent)}main{padding:14px 18px 16px;min-width:0;min-height:0;display:flex;flex-direction:column;gap:10px;overflow:hidden}.topbar{display:flex;align-items:center;gap:14px;flex:0 0 56px;min-height:56px;border-bottom:1px solid var(--line);padding-bottom:8px}.topbar-actions{display:flex;align-items:center;gap:8px;margin-left:auto}.status-pill{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:3px 8px}.devtools{position:relative}.devtools summary{cursor:pointer;list-style:none;font-size:12px;color:var(--muted);padding:6px 8px;border:1px solid var(--line);border-radius:7px}.devtools-pop{position:absolute;right:0;top:34px;z-index:20;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;width:340px;display:grid;gap:8px;box-shadow:0 10px 30px rgba(16,24,40,.15)}.devtools-pop label{display:grid;gap:4px;font-size:11px;color:var(--muted)}.topbar-title{min-width:220px}
h1{font-size:17px;margin:0}h2{font-size:14px;margin:0;color:var(--muted)}h3{font-size:13px;margin:0 0 8px}
input,button,textarea{font:inherit;color:inherit}input,textarea{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:36px}button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 11px;min-height:34px;cursor:pointer}button.primary{background:var(--accent);color:#fff;border-color:transparent}button:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:7px}.muted{color:var(--muted);font-size:12px}.stack{display:flex;flex-direction:column;gap:7px}
.workspace{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 8px rgba(16,24,40,.04);overflow:hidden;display:flex;flex-direction:column;flex:0 0 30vh;min-height:250px}
.workspace-head{padding:12px 16px 4px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.workspace-title{font-size:22px;font-weight:650;letter-spacing:-.02em}.workspace-sub{color:var(--muted);font-size:12px;margin-top:3px}.panel-kicker{font-size:11px;font-weight:650;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.toolbar{display:flex;justify-content:center;gap:4px;padding:2px 0 10px}.toolbar button{width:38px;height:34px;display:grid;place-items:center;border-radius:9px;background:transparent;border-color:transparent}.toolbar button:hover{background:var(--bg)}.toolbar button.active{background:var(--soft);color:var(--accent)}
.canvas-wrap{position:relative;flex:1;min-height:0;margin:0 12px 12px;border:1px solid var(--line);border-radius:14px;background:var(--canvas);overflow:hidden}
#canvas{display:block;width:100%;height:100%;min-height:0;touch-action:none;cursor:grab}
.splitter{height:12px;flex:0 0 12px;cursor:row-resize;display:grid;place-items:center;outline:none}.splitter span{width:52px;height:4px;border-radius:99px;background:var(--line)}.splitter:hover span,.splitter:focus span{background:var(--accent)}#canvas.hand{cursor:grab}#canvas.grabbing{cursor:grabbing}
.grid-dot{fill:#dfe3ea}.wnode{cursor:pointer}.wnode .node-bg{fill:#fff;stroke:#e1e4ea;stroke-width:1;filter:drop-shadow(0 2px 4px rgba(20,28,48,.06))}.wnode:hover .node-bg{stroke:#b9c0ca}.wnode.selected .node-bg{stroke:var(--accent);stroke-width:2}.wnode .glyph{fill:none;stroke:#222831;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.wnode .label{font-size:13px;font-weight:600;fill:var(--ink);text-anchor:middle}.wnode .kind{font-size:10px;fill:var(--muted);text-anchor:middle}
.edge{fill:none;stroke:#b9c0ca;stroke-width:1.4;marker-end:url(#arrow)}.port{fill:#fff;stroke:#b9c0ca;stroke-width:1.2;pointer-events:none}.port-hit{cursor:crosshair}.wnode.selected .port{stroke:var(--accent);fill:var(--soft)}.wnode.connect-target .node-bg{stroke:var(--accent);stroke-width:2;fill:var(--soft)}.edge.temp-edge{stroke:var(--accent);stroke-dasharray:4 3;marker-end:none}.empty{fill:var(--muted);font-size:13px;text-anchor:middle}
.zoom{position:absolute;right:14px;bottom:10px;font-size:11px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:3px 9px}
.crumbs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.crumb{background:var(--soft);border:0;border-radius:99px;padding:3px 9px;font-size:12px}.crumb-sep{color:var(--muted);font-size:11px}
.detail{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 8px rgba(16,24,40,.04);padding:16px;flex:1 1 0;min-height:0;overflow:hidden;display:flex;flex-direction:column}.detail-head{display:flex;justify-content:space-between;align-items:start;gap:10px;margin-bottom:14px}.detail-title{font-size:20px;font-weight:700;letter-spacing:-.02em}.detail-meta{display:flex;gap:14px;flex-wrap:wrap;align-items:center}.detail-meta .param{display:inline-flex;flex-direction:row;gap:4px;margin:0}.detail-meta .param b{font-size:12px}.detail-meta .param span{font-size:12px}.detail-actions{display:flex;align-items:center;gap:4px}.detail-actions .quiet{background:transparent;border-color:transparent;color:var(--muted);padding:5px 8px;font-size:12px}.detail-actions .quiet:hover{background:var(--bg);color:var(--ink)}.param{display:flex;flex-direction:column;gap:2px;margin:8px 0}.param b{font-weight:550}.param span{color:var(--muted);font-size:12px}
.cards{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-auto-rows:minmax(220px,1fr);gap:12px;align-items:stretch;flex:1 1 0;min-height:0;overflow:auto}.card[data-component="content.table"],.card[data-component="layout.table"],.card[data-component="content.note"],.card[data-component="content.markdown"]{grid-column:span 8}.card[data-component="lab.well_plate"],.card[data-component="tool.calculator"]{grid-column:span 4}.card[data-component="workflow"]{grid-column:span 6}.card{margin:0;box-sizing:border-box;min-width:0;overflow:auto;display:flex;flex-direction:column}@media(max-width:900px){.cards{grid-template-columns:1fr;grid-auto-rows:minmax(220px,auto);overflow:auto}.card{min-height:220px}}.plate{display:grid;gap:4px;margin:10px 0}.well{width:30px;height:30px;padding:0;border-radius:6px;border:1px solid var(--line);background:#f7f8fb;font-size:10px;color:var(--muted)}.well.assigned{background:#eef0ff;border-color:#c7cdfd;color:var(--ink)}.well.selected{background:var(--accent);border-color:var(--accent);color:#fff}.well:disabled{opacity:.25;cursor:default}.card{position:relative;border:1px solid var(--line);border-radius:10px;padding:16px;background:#fff;box-shadow:0 1px 2px rgba(16,24,40,.02)}.card h3{font-size:15px;line-height:1.35;margin:0 0 6px;padding-right:84px;display:flex;align-items:center;gap:8px}.card .tag{font-size:12px;color:var(--muted)}.card .tag{font-size:10px;color:var(--muted)}.card button{margin-top:7px;padding:4px 8px;font-size:11px}
textarea{min-height:54px;resize:vertical}
table{border-collapse:collapse;width:100%;font-size:12px;margin-top:8px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:6px 4px}th{color:var(--muted);font-weight:500}.editable-table input{min-height:34px;border:0;background:transparent;padding:6px 8px;border-radius:5px}.editable-table input:focus{background:var(--soft);outline:1px solid var(--accent)}.table-actions{margin-top:6px}.empty-card{font-size:12px;color:var(--muted);padding:10px 0}.md-preview{font-size:13px;line-height:1.65}.md-preview h1{font-size:17px}.md-preview h2{font-size:15px}.md-preview h3{font-size:13px}.md-preview code{background:var(--bg);padding:1px 4px;border-radius:4px}
#status{min-height:18px}.preview{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}.card-actions{position:absolute;right:10px;top:10px;display:inline-flex;gap:2px}.card-actions button{width:28px;height:28px;padding:0;border:0;border-radius:6px;background:transparent;color:var(--muted)}.card-actions button:hover{background:var(--bg);color:var(--ink)}.library{position:absolute;right:16px;bottom:16px;z-index:8;max-width:520px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;box-shadow:0 8px 24px rgba(16,24,40,.12)}.library h3{width:100%;margin:0 0 2px}.library button{font-size:12px;padding:4px 8px}.selection-detail{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.7}.calc-result{margin-top:8px;border-top:1px solid var(--line);padding-top:8px}.calc-result table{font-size:11px}.inbox{position:absolute;right:16px;top:58px;z-index:9;width:360px;max-height:60%;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;box-shadow:0 8px 24px rgba(16,24,40,.12)}.inbox-head{display:flex;align-items:center;gap:8px;font-size:12px}.inbox-head b{margin-right:4px}.inbox-head button{margin-left:auto;padding:3px 8px;font-size:11px}.inbox-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:12px}.inbox-row>div{flex:1;min-width:0}.inbox-row button{padding:3px 8px;font-size:11px}.proposal{position:absolute;right:16px;bottom:58px;z-index:8;width:360px;max-height:42%;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:12px;background:#fbfbff;box-shadow:0 8px 24px rgba(16,24,40,.12)}.proposal-title{font-size:13px;font-weight:650;margin-bottom:4px}.proposal-empty{font-size:12px;color:var(--muted)}.diff-list{border-top:1px solid var(--line);margin:8px 0;padding-top:8px}.diff-row{display:flex;gap:10px;font-size:12px;padding:3px 0}.diff-row b{min-width:54px;color:var(--muted);font-weight:500}.diff-row span{overflow-wrap:anywhere}.agent-prompt{display:flex;gap:6px;margin:8px 0}.agent-prompt input{flex:1}.card.selected{outline:2px solid var(--accent);outline-offset:2px}
html[data-bs-theme="dark"]{--bg:#101318;--panel:#171b22;--ink:#e7eaf0;--muted:#98a2b3;--line:#2a303b;--accent:#6d8cff;--soft:#1d2638;--canvas:#11151b;--ok:#49b675}.theme-toggle{width:32px;height:32px;padding:0;border-radius:8px;border-color:transparent;background:transparent;color:var(--muted)}
@media(max-width:1100px){.shell{grid-template-columns:64px minmax(0,1fr)}.brand-copy,.project-picker,.rail-item span,.rail-foot{display:none}.rail-item{justify-content:center;padding:0}.cards .card{grid-column:span 12!important}}@media(max-width:700px){main{padding:10px}.topbar{flex-wrap:wrap}.workspace{flex-basis:300px;min-height:220px}}
</style>
<link rel="stylesheet" href="/components/tokens.css">
<link rel="stylesheet" href="/components/wellplate.css">
<link rel="stylesheet" href="/components/table.css">
<link rel="stylesheet" href="/components/calculator.css">
<link rel="stylesheet" href="/components/flow.css">
<link rel="stylesheet" href="/components/markdown.css">
<link rel="stylesheet" href="/components/proposal.css">
</head>
<body>
<div class="shell">
<aside class="rail">
  <div class="brand-row"><div class="brand" title="AsterLab">AL</div><div class="brand-copy"><strong>AsterLab</strong><span>实验工作台</span></div></div>
  <label class="project-picker"><span>项目</span><select aria-label="当前项目"><option>CCK-8 assay</option><option>L929 culture</option><option>Biofilm CV</option></select></label>
  <nav class="rail-nav" aria-label="主导航">
    <button class="rail-item active" title="实验设计" aria-label="实验设计"><img src="/icons/plate.svg" alt=""><span>实验设计</span></button>
    <button class="rail-item" title="Protocol" aria-label="Protocol"><img src="/icons/pipette.svg" alt=""><span>Protocol</span></button>
    <button class="rail-item" title="实验运行" aria-label="实验运行"><img src="/icons/incubator.svg" alt=""><span>实验运行</span></button>
    <button class="rail-item" title="资料与工具" aria-label="资料与工具"><img src="/icons/flask.svg" alt=""><span>资料与工具</span></button>
  </nav>
  <div class="rail-foot muted">本地工作区<br>SQLite · 127.0.0.1</div>
</aside>
<main>
  <header class="topbar">
    <div class="topbar-title">
      <div class="workspace-title" id="workspaceTitle">CCK-8 Assay</div>
      <div class="workspace-sub" id="workspaceSub">Design draft · View v1</div>
    </div>
    <div class="topbar-actions">
      <span id="status" class="status-pill" role="status">就绪</span>
      <button id="themeToggle" class="theme-toggle" type="button" title="切换主题" aria-label="切换主题">◐</button>
      <details class="devtools"><summary>开发</summary><div class="devtools-pop"><label>View ID<input id="viewId" placeholder="View ID" aria-label="View ID"></label><button class="primary" id="openView">打开视图</button></div></details>
    </div>
  </header>
  <div class="crumbs" id="crumbs"></div>
  <section class="workspace" id="canvasPanel">
    <div class="workspace-head">
      <div>
        <div class="panel-kicker">实验设计流程</div>
        <div class="muted">受限流程 · 连线来自 View · 科学顺序由 Protocol 决定</div>
      </div>
      <div class="row">
        <button id="undo" title="撤销布局" disabled>↶</button>
        <button id="redo" title="重做布局" disabled>↷</button>
      </div>
    </div>
    <div class="toolbar" role="toolbar" aria-label="画布工具">
      <button id="selectTool" class="active" title="选择">↖</button>
      <button id="handTool" title="平移">✋</button>
      <button id="fit" title="适应屏幕">⤢</button>
      <button id="zoomIn" title="放大">＋</button>
      <button id="zoomOut" title="缩小">−</button>
    </div>
    <div class="canvas-wrap">
      <svg id="canvas" viewBox="0 0 1100 360" preserveAspectRatio="xMidYMid meet" role="img" aria-label="实验流程画布"></svg>
      <div class="zoom" id="zoomLabel">100%</div>
    </div>
  </section>
  <div class="splitter" id="splitter" role="separator" aria-label="调整画布与详情高度" aria-orientation="horizontal" tabindex="0"><span></span></div>
  <section class="detail" id="detail"><div class="muted">选择一个步骤查看详情。</div></section>
</main>
</div>
<script src="/icons/inline.js"></script>
<script src="/vendor/dagre.js"></script>
<script src="/layout.js"></script>
<script src="/vendor/marked.js"></script>
<script src="/vendor/purify.js"></script>
<script src="/vendor/tabler/tabler.min.js"></script>
<script src="/app.js"></script>
<script src="/components/wellplate.js"></script>
<script src="/components/table.js"></script>
<script src="/components/calculator.js"></script>
<script src="/components/flow.js"></script>
<script src="/components/markdown.js"></script>
<script src="/components/proposal.js"></script>
</body>
</html>
