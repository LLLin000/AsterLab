<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>实验组件视图</title>
<style>
:root{color-scheme:light;--bg:#f4f5f8;--panel:#fff;--ink:#1d2026;--muted:#7a8290;--line:#e2e5ea;--accent:#5b6cff;--soft:#eef0ff;--canvas:#fbfbfd;--ok:#2f8f62}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,"Segoe UI","Microsoft YaHei",sans-serif}
.shell{min-height:100vh;display:grid;grid-template-columns:250px minmax(0,1fr)}aside{background:var(--panel);border-right:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:14px}main{padding:22px;min-width:0;display:flex;flex-direction:column;gap:14px}
h1{font-size:17px;margin:0}h2{font-size:14px;margin:0;color:var(--muted)}h3{font-size:13px;margin:0 0 8px}
input,button,textarea{font:inherit;color:inherit}input,textarea{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px}button{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:7px 10px;cursor:pointer}button.primary{background:var(--accent);color:#fff;border-color:transparent}button:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:7px}.muted{color:var(--muted);font-size:12px}.stack{display:flex;flex-direction:column;gap:7px}
.workspace{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 30px rgba(20,28,48,.06);overflow:hidden;display:flex;flex-direction:column;min-height:650px}
.workspace-head{padding:20px 22px 8px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.workspace-title{font-size:20px;font-weight:700;letter-spacing:-.01em}.workspace-sub{color:var(--muted);font-size:12px;margin-top:3px}
.toolbar{display:flex;justify-content:center;gap:4px;padding:2px 0 10px}.toolbar button{width:38px;height:34px;display:grid;place-items:center;border-radius:9px;background:transparent;border-color:transparent}.toolbar button:hover{background:var(--bg)}.toolbar button.active{background:var(--soft);color:var(--accent)}
.canvas-wrap{position:relative;flex:1;min-height:390px;margin:0 14px;border:1px solid var(--line);border-radius:14px;background:var(--canvas);overflow:hidden}
#canvas{display:block;width:100%;height:100%;min-height:390px;touch-action:none;cursor:grab}#canvas.hand{cursor:grab}#canvas.grabbing{cursor:grabbing}
.grid-dot{fill:#dfe3ea}.wnode{cursor:pointer}.wnode .node-bg{fill:#fff;stroke:#e1e4ea;stroke-width:1;filter:drop-shadow(0 2px 4px rgba(20,28,48,.06))}.wnode:hover .node-bg{stroke:#b9c0ca}.wnode.selected .node-bg{stroke:var(--accent);stroke-width:2}.wnode .glyph{fill:none;stroke:#222831;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.wnode .label{font-size:13px;font-weight:600;fill:var(--ink);text-anchor:middle}.wnode .kind{font-size:10px;fill:var(--muted);text-anchor:middle}
.edge{fill:none;stroke:#b9c0ca;stroke-width:1.4;marker-end:url(#arrow)}.empty{fill:var(--muted);font-size:13px;text-anchor:middle}
.zoom{position:absolute;right:14px;bottom:10px;font-size:11px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:3px 9px}
.crumbs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.crumb{background:var(--soft);border:0;border-radius:99px;padding:3px 9px;font-size:12px}.crumb-sep{color:var(--muted);font-size:11px}
.detail{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 30px rgba(20,28,48,.05);padding:18px 20px}.detail-head{display:flex;justify-content:space-between;align-items:start;gap:10px;margin-bottom:14px}.detail-title{font-size:18px;font-weight:700}.detail-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:26px}.param{display:flex;flex-direction:column;gap:2px;margin:8px 0}.param b{font-weight:550}.param span{color:var(--muted);font-size:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.plate-card{grid-column:span 2}.plate{display:grid;grid-template-columns:repeat(12,17px);gap:3px;margin:8px 0}.well{width:17px;height:17px;padding:0;border-radius:4px;border:1px solid var(--line);background:#f7f8fb;font-size:7px;color:var(--muted)}.well.assigned{background:#eef0ff;border-color:#c7cdfd;color:var(--ink)}.well.selected{background:var(--accent);border-color:var(--accent);color:#fff}.well:disabled{opacity:.25;cursor:default}.card{border:1px solid var(--line);border-radius:11px;padding:10px;background:#fff}.card h3{font-size:12px;margin:0 0 3px}.card .tag{font-size:10px;color:var(--muted)}.card button{margin-top:7px;padding:4px 8px;font-size:11px}
textarea{min-height:54px;resize:vertical}
table{border-collapse:collapse;width:100%;font-size:12px;margin-top:8px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:6px 4px}th{color:var(--muted);font-weight:500}
#status{min-height:18px}.preview{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
@media(max-width:900px){.shell{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line)}main{padding:14px}.detail-grid{grid-template-columns:1fr}.workspace{min-height:560px}}
</style>
</head>
<body>
<div class="shell">
<aside>
  <h1>实验组件视图</h1>
  <div class="muted">打开已保存的 ViewDocument。</div>
  <div class="row"><input id="viewId" placeholder="View ID"><button class="primary" id="load">打开</button></div>
  <div class="muted" style="margin-top:6px">数据预览输入（缺省则保持 Unresolved）</div>
  <div class="stack">
    <input id="positions" placeholder="目标孔位，如 A1,B1">
    <div class="row"><input id="volume" placeholder="每孔体积"><input id="unit" placeholder="单位，如 uL"></div>
    <input id="extraRatio" placeholder="额外比例，如 0.1">
  </div>
  <div class="muted">画布只表达 View 的视觉组织；科学执行顺序仍由 Protocol 决定。</div>
  <div id="status" class="muted"></div>
</aside>
<main>
  <div class="crumbs" id="crumbs"></div>
  <section class="workspace">
    <div class="workspace-head">
      <div>
        <div class="workspace-title" id="workspaceTitle">AsterLab / CCK-8 Assay</div>
        <div class="workspace-sub" id="workspaceSub">Protocol · View</div>
      </div>
      <div class="row">
        <button id="undo" title="撤销布局" disabled>↶</button>
        <button id="redo" title="重做布局" disabled>↷</button>
      </div>
    </div>
    <div class="toolbar" role="toolbar" aria-label="画布工具">
      <button id="selectTool" class="active" title="选择">↖</button>
      <button id="handTool" title="平移">✋</button>
      <button id="fit" title="适应屏幕">⤢</button>
      <button id="zoomIn" title="放大">＋</button>
      <button id="zoomOut" title="缩小">−</button>
    </div>
    <div class="canvas-wrap">
      <svg id="canvas" viewBox="0 0 1100 560" role="img" aria-label="实验流程画布"></svg>
      <div class="zoom" id="zoomLabel">100%</div>
    </div>
  </section>
  <section class="detail" id="detail"><div class="muted">选择一个步骤查看详情。</div></section>
</main>
</div>
<script>
let viewId="", data=null, node=null, selected=null, stack=[], mode="select";
let view={x:0,y:0,k:1}, pan=null, dragNode=null, nodeMoved=false;
let history=[], future=[], saveChain=Promise.resolve();
let paramCache=new Map(), plateCache=new Map(), plateSelections=new Map();
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const defName=c=>c?.definition?.id||"component";
const nodeTitle=c=>c?.props?.label||c?.props?.title||defName(c);
const scopeLabel=c=>c?.model_ref?.step?.scope?.assay_id?`assay: ${c.model_ref.step.scope.assay_id}`:"";
const workflowOf=c=>c?.workflow?.nodes||[];
const slotsOf=c=>c?.slots||{};
const findById=(root,id)=>{let hit=null;const walk=c=>{if(c.instance_id===id)hit=c;Object.values(c.slots||{}).flat().forEach(walk);(c.workflow?.nodes||[]).forEach(n=>walk(n.component))};walk(root);return hit};

function iconFor(c){
  const visual=c?.visual||{};
  const explicit=(visual.symbol||visual.template||"").toLowerCase();
  const allowed=["plate","pipette","incubator","reader","flask"];
  let key=allowed.includes(explicit)?explicit:"flask";
  const def=defName(c);
  if(!allowed.includes(explicit)&&def==="lab.well_plate")key="plate";
  return `<image class="bioicon" href="/icons/${key}.svg" x="8" y="7" width="60" height="60" preserveAspectRatio="xMidYMid meet"/>`;
}
function renderCrumbs(){
  $("crumbs").innerHTML=stack.map((c,i)=>`<button class="crumb" data-i="${i}">${esc(nodeTitle(c))}</button>`).join('<span class="crumb-sep">›</span>');
  $("crumbs").querySelectorAll("button").forEach(b=>b.onclick=()=>{stack=stack.slice(0,Number(b.dataset.i)+1);node=stack[stack.length-1];selected=workflowOf(node)[0]?.component||node;render()});
}
function graph(){
  if(!node||!node.workflow)return {nodes:[],edges:[]};
  const nodes=node.workflow.nodes||[];
  const edges=node.workflow.edges||[];
  const gap=190, start=550-((nodes.length-1)*gap)/2-38, y=150;
  nodes.forEach((n,i)=>{const c=n.component;const v=c.visual||{};if(typeof v.x!=="number"){c._vx=start+i*gap;c._vy=y}else{c._vx=v.x;c._vy=v.y}});
  return {nodes,edges};
}
function nodeBox(c){return {x:c._vx??80,y:c._vy??175,w:76,h:76}}
function renderCanvas(){
  const svg=$("canvas"); const {nodes,edges}=graph();
  const byId={}; nodes.forEach(n=>{byId[n.node_id]=n.component;byId[n.component.instance_id]=n.component});
  const edgeMarkup=edges.map(e=>{const a=byId[e.from],b=byId[e.to];if(!a||!b)return "";const A=nodeBox(a),B=nodeBox(b);const x1=A.x+76,y1=A.y+38,x2=B.x,y2=B.y+38;const mid=x1+(x2-x1)/2;return `<path class="edge" d="M${x1} ${y1} C${mid} ${y1},${mid} ${y2},${x2-5} ${y2}"/>`}).join("");
  const nodeMarkup=nodes.map(n=>{const c=n.component,B=nodeBox(c);const active=selected?.instance_id===c.instance_id;const hint=(c.visual?.symbol||c.visual?.template||"").trim();return `<g class="wnode ${active?"selected":""}" data-node="${esc(c.instance_id)}" transform="translate(${B.x} ${B.y})" tabindex="0" role="button" aria-label="${esc(nodeTitle(c))}"><rect class="node-bg" width="76" height="76" rx="18"/><g class="glyph">${iconFor(c)}</g><text class="label" x="38" y="101">${esc(nodeTitle(c))}</text><text class="kind" x="38" y="116">${esc(hint||defName(c))}</text></g>`}).join("");
  const empty=nodes.length?"":`<text class="empty" x="550" y="260">此 View 还没有工作流节点。</text>`;
  const dots=Array.from({length:16},(_,r)=>Array.from({length:24},(_,c)=>`<circle class="grid-dot" cx="${40+c*44}" cy="${40+r*34}" r="1"/>`).join("")).join("");
  svg.innerHTML=`<defs><pattern id="dots" width="44" height="34" patternUnits="userSpaceOnUse">${dots}</pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b9c0ca"/></marker></defs><rect width="1100" height="560" fill="url(#dots)"/><g id="viewport" transform="translate(${view.x} ${view.y}) scale(${view.k})">${edgeMarkup}${nodeMarkup}${empty}</g>`;
  svg.querySelectorAll(".wnode").forEach(el=>{
    el.addEventListener("pointerdown",ev=>startNodeDrag(ev,byId[el.dataset.node]));
    el.addEventListener("click",ev=>{ev.stopPropagation();if(nodeMoved){nodeMoved=false;return}selectComponent(byId[el.dataset.node])});
    el.addEventListener("dblclick",ev=>{ev.stopPropagation();const c=byId[el.dataset.node];if(c?.workflow?.nodes?.length){enterComponent(c)}});
  });
  $("zoomLabel").textContent=`${Math.round(view.k*100)}%`;
  updateHistoryButtons();
}
function updateHistoryButtons(){$("undo").disabled=history.length===0;$("redo").disabled=future.length===0}
function selectComponent(c){selected=c;renderCanvas();renderDetail()}
function enterComponent(c){node=c;stack.push(c);selected=workflowOf(c)[0]?.component||c;render()}
function fmtValue(value){if(value===null||value===undefined)return "待确认";if(typeof value==="object")return JSON.stringify(value);return String(value)}
async function loadParams(c,boxId){
  const ref=c?.model_ref||{};
  if(ref.kind!=="operation_use")return;
  const key=`${viewId}|${c.instance_id}`;
  let result=paramCache.get(key);
  if(!result){
    try{
      const r=await fetch(`/api/views/${encodeURIComponent(viewId)}/steps/${encodeURIComponent(c.instance_id)}`);
      const j=await r.json(); if(!r.ok)throw new Error(j.error||"参数读取失败"); result=j;
    }catch(e){result={error:String(e.message||e)}} paramCache.set(key,result)
  }
  if(selected?.instance_id!==c.instance_id)return;
  const box=$(boxId);if(!box)return;
  if(result.error){box.innerHTML=`<div class="muted">${esc(result.error)}</div>`;return}
  const step=result.step||{};
  const params=step.parameters||[];
  const unresolved=step.unresolved_parameter_refs||[];
  const rows=params.map(p=>{
    const label=p.label||p.key||p.slot||"参数";const unit=p.unit?` ${p.unit}`:"";
    const source=p.value_source||p.source||"";
    return `<div class="param"><b>${esc(label)}</b><span>${esc(fmtValue(p.value))}${esc(unit)}${source?" · "+esc(source):""}</span></div>`
  }).join("");
  const pending=unresolved.map(key=>{const item=(result.unresolved_parameters||[]).find(p=>p.slot===key||p.label===key)||{};return `<div class="param"><b>${esc(item.label||key)}</b><span>待确认${item.unit?" · "+esc(item.unit):""}</span></div>`}).join("");
  box.innerHTML=rows+pending||`<div class="muted">该步骤没有已解析参数。</div>`;
}
function plateMarkup(plate,instanceId){
  const assigned=new Map((plate.positions||[]).map(p=>[p.position_id,p]));
  const selected=plateSelections.get(instanceId)||new Set();
  const rowCount=Math.max(1,Number(plate.rows)||8), colCount=Math.max(1,Number(plate.columns)||12);
  const rows=Array.from({length:rowCount},(_,i)=>String.fromCharCode(65+i));
  let html="";
  for(const row of rows)for(let col=1;col<=colCount;col++){
    const id=`${row}${col}`; const hit=assigned.get(id); const on=selected.has(id);
    const target=hit?.targets?.[0]?.target?.id||"";
    html+=`<button class="well ${hit?"assigned":""} ${on?"selected":""}" data-well="${id}" data-plate="${esc(instanceId)}" ${hit?"":"disabled"} title="${id}${hit?" · "+esc(target):" · 未分配"}">${id}</button>`
  }
  return `<div class="plate">${html}</div><div class="muted">已选 ${selected.size} / 计划 ${assigned.size} 孔</div>`;
}
async function loadPlate(instanceId,boxId){
  let plate=plateCache.get(instanceId);
  if(!plate){
    try{
      const r=await fetch(`/api/views/${encodeURIComponent(viewId)}/data?instance_id=${encodeURIComponent(instanceId)}`);
      const j=await r.json(); if(!r.ok)throw new Error(j.error||"孔位读取失败"); plate=(j.result??j).plate; plateCache.set(instanceId,plate);
    }catch(e){const box=$(boxId);if(box)box.innerHTML=`<div class="muted">${esc(e.message)}</div>`;return}
  }
  if(!plateSelections.has(instanceId))plateSelections.set(instanceId,new Set((plate.positions||[]).map(p=>p.position_id)));
  const box=$(boxId);if(!box)return;box.innerHTML=plateMarkup(plate,instanceId);
  box.querySelectorAll(".well").forEach(btn=>btn.onclick=()=>{
    const set=plateSelections.get(instanceId)||new Set();
    if(set.has(btn.dataset.well))set.delete(btn.dataset.well);else set.add(btn.dataset.well);
    plateSelections.set(instanceId,set);box.innerHTML=plateMarkup(plate,instanceId);
    box.querySelectorAll(".well").forEach(b=>b.onclick=()=>toggleWell(instanceId,b.dataset.well,plate,boxId));
  });
}
function toggleWell(instanceId,well,plate,boxId){
  const set=plateSelections.get(instanceId)||new Set();if(set.has(well))set.delete(well);else set.add(well);plateSelections.set(instanceId,set);
  const box=$(boxId);if(box){box.innerHTML=plateMarkup(plate,instanceId);box.querySelectorAll(".well").forEach(b=>b.onclick=()=>toggleWell(instanceId,b.dataset.well,plate,boxId))}
}
function renderDetail(){
  const c=selected;
  if(!c){$("detail").innerHTML='<div class="muted">选择一个步骤查看详情。</div>';return}
  const slots=slotsOf(c); const cards=[];
  for(const [slot,children] of Object.entries(slots)) for(const child of children){
    if(child.definition.id==="content.note"){
      cards.push(`<div class="card"><h3>${esc(nodeTitle(child))}</h3><div class="tag">${esc(defName(child))}</div><textarea id="note-${esc(child.instance_id)}">${esc(child.props?.text||"")}</textarea><div class="row" style="margin-top:6px"><button data-save="${esc(child.instance_id)}">保存说明</button></div></div>`);
    } else if(child.definition.id==="workflow"||child.workflow?.nodes?.length){
      cards.push(`<div class="card"><h3>${esc(nodeTitle(child))}</h3><div class="tag">嵌套流程 · ${workflowOf(child).length} 步</div><button data-enter="${esc(child.instance_id)}">进入</button></div>`);
    } else if(child.definition.id==="lab.well_plate"){
      cards.push(`<div class="card plate-card"><h3>${esc(nodeTitle(child))}</h3><div class="tag">${esc(slot)} · ${esc(child.model_ref?.container_id||"")}</div><div id="plate-body-${esc(child.instance_id)}"><div class="muted">读取孔位…</div></div><button data-plate-preview="${esc(child.instance_id)}">计算选中孔位</button></div>`);
    } else {
      cards.push(`<div class="card"><h3>${esc(nodeTitle(child))}</h3><div class="tag">${esc(slot)}</div><div class="muted">${esc(child.definition.id)}</div></div>`);
    }
  }
  const ref=c.model_ref||{};
  const refLine=ref.kind==="operation_use"?`Protocol step · ${esc(ref.step?.step_path||"")}`:ref.kind?esc(ref.kind):"未绑定科学对象";
  $("detail").innerHTML=`<div class="detail-head"><div><div class="detail-title">${esc(nodeTitle(c))} · Step Detail</div><div class="muted">${esc(defName(c))} · ${esc(c.instance_id)}</div></div><button id="collapse" aria-label="收起">⌃</button></div><div class="detail-grid"><div><h3>操作参数</h3><div id="params-${esc(c.instance_id)}" class="muted">读取 ProtocolPreview…</div><div class="param"><b>科学引用</b><span>${refLine}</span></div></div><div><h3>相关组件</h3><div class="cards">${cards.join("")||'<div class="muted">此步骤暂无详情组件。</div>'}</div></div></div><div id="preview" class="preview"></div>`;
  $("detail").querySelectorAll('[data-enter]').forEach(b=>b.onclick=()=>{const child=findById(data.latest_version.data.root,b.dataset.enter);if(child)enterComponent(child)});
  $("detail").querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>saveNote(b.dataset.save));
  $("detail").querySelectorAll('[data-plate-preview]').forEach(b=>b.onclick=()=>{const set=[...plateSelections.get(b.dataset.platePreview)||[]].sort();if(!set.length){$("status").textContent="请先选择至少一个孔位";return}loadData(b.dataset.platePreview,set.join(","))});
  Object.values(slots).flat().filter(child=>child.definition.id==="lab.well_plate").forEach(child=>loadPlate(child.instance_id,`plate-body-${child.instance_id}`));
  loadParams(c,`params-${c.instance_id}`);
}
function render(){renderCrumbs();renderCanvas();renderDetail();$("workspaceTitle").textContent=(data?.latest_version?.data?.root?.props?.title)||"AsterLab / CCK-8 Assay";const d=data?.latest_version?.data;$("workspaceSub").textContent=d?`View revision ${d.revision} · ${esc(d.document_id).slice(0,8)}`:"Protocol · View"}
async function load(preserveHistory=false,preserveUi=false){
  viewId=$("viewId").value.trim();if(!viewId)return;$("status").textContent="加载中…";
  const previousStack=stack.map(c=>c.instance_id),previousNode=node?.instance_id,previousSelected=selected?.instance_id;
  const r=await fetch(`/api/views/${encodeURIComponent(viewId)}`);const j=await r.json();if(!r.ok){$("status").textContent=j.error||"加载失败";return}
  data=j;const root=data.latest_version?.data?.root;
  if(preserveUi){
    stack=previousStack.map(id=>findById(root,id)).filter(Boolean);if(!stack.length)stack=root?[root]:[];
    node=findById(root,previousNode)||root;selected=findById(root,previousSelected)||workflowOf(node)[0]?.component||node;
  }else{
    node=root;stack=node?[node]:[];selected=workflowOf(node)[0]?.component||node;
    paramCache.clear();plateCache.clear();plateSelections.clear();
  }
  if(!preserveHistory){history=[];future=[]}
  render();$("status").textContent=`revision ${data.latest_version?.data?.revision??"?"}`
}
async function saveNote(instanceId){
  if(!data)return;const doc=data.latest_version.data;const text=$("note-"+CSS.escape(instanceId))?.value??"";
  const changeset={changeset_id:`ui-${Date.now()}`,document_id:doc.document_id,expected_revision:doc.revision,operations:[{kind:"update_props",instance_id:instanceId,property:"text",value:text}],provenance:["view-ui"]};
  $("status").textContent="保存中…";const r=await fetch(`/api/views/${encodeURIComponent(viewId)}/revise`,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({changeset})});const j=await r.json();if(!r.ok){$("status").textContent=j.error||"保存失败";return}$("status").textContent="已保存";await load(true,true)
}
function screenToSvg(clientX,clientY){
  const svg=$("canvas"),p=svg.createSVGPoint();p.x=clientX;p.y=clientY;const ctm=svg.getScreenCTM();
  if(!ctm)return {x:view.x,y:view.y};return p.matrixTransform(ctm.inverse())
}
function screenToCanvas(clientX,clientY){
  const u=screenToSvg(clientX,clientY);return {x:(u.x-view.x)/view.k,y:(u.y-view.y)/view.k}
}
function persistVisual(instanceId,pos){
  const task=async()=>{
    const doc=data?.latest_version?.data;if(!doc)throw new Error("View 未加载");
    const changeset={changeset_id:`ui-visual-${Date.now()}`,document_id:doc.document_id,expected_revision:doc.revision,operations:[{kind:"set_visual",instance_id:instanceId,x:pos.x,y:pos.y}],provenance:["view-ui","canvas-drag"]};
    $("status").textContent="保存布局…";
    const r=await fetch(`/api/views/${encodeURIComponent(viewId)}/revise`,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({changeset})});
    const j=await r.json();
    if(!r.ok){$("status").textContent=j.error||"布局保存失败";await load(true,true);throw new Error(j.error||"布局保存失败")}
    await load(true,true);$("status").textContent="布局已保存"
  };
  const run=saveChain.then(task,task);saveChain=run.catch(()=>{});return run
}
async function loadData(instanceId,positionsOverride){
  if(!data)return;const all=[];const walk=c=>{all.push(c);Object.values(c.slots||{}).flat().forEach(walk);(c.workflow?.nodes||[]).forEach(n=>walk(n.component))};walk(data.latest_version.data.root);const calc=all.find(c=>c.definition?.id==="tool.calculator");
  const params=new URLSearchParams({instance_id:instanceId});if(calc)params.set("calculator_instance_id",calc.instance_id);
  const positions=positionsOverride??$("positions").value.trim();
  if(positionsOverride)$("positions").value=positions;
  if(positions)params.set("position_ids",positions);
  if($("volume").value.trim())params.set("volume_per_well",$("volume").value.trim());if($("unit").value.trim())params.set("volume_unit",$("unit").value.trim());if($("extraRatio").value.trim())params.set("extra_ratio",$("extraRatio").value.trim());
  $("status").textContent="加载数据…";const r=await fetch(`/api/views/${encodeURIComponent(viewId)}/data?${params}`);const j=await r.json();if(!r.ok){$("status").textContent=j.error||"数据加载失败";return}const payload=j.result??j;const table=payload.table;const box=$("preview");if(!box)return;
  box.innerHTML=`<h3>数据预览</h3><table><thead><tr>${table.columns.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${table.rows.map(row=>`<tr>${row.map(v=>`<td>${esc(v)}</td>`).join("")}</tr>`).join("")}</tbody></table><div class="muted">${esc(table.unresolved.join(", ")||"resolved")}</div>`;$("status").textContent="数据已加载"
}
function startNodeDrag(ev,c){
  if(mode==="hand")return;ev.stopPropagation();const B=nodeBox(c);const start=screenToCanvas(ev.clientX,ev.clientY);
  dragNode={c,start,x:B.x,y:B.y};nodeMoved=false;
  const move=e=>{if(!dragNode)return;const now=screenToCanvas(e.clientX,e.clientY);const dx=now.x-dragNode.start.x,dy=now.y-dragNode.start.y;if(Math.abs(dx)+Math.abs(dy)>2)nodeMoved=true;dragNode.c._vx=dragNode.x+dx;dragNode.c._vy=dragNode.y+dy;dragNode.c.visual={...(dragNode.c.visual||{}),x:dragNode.c._vx,y:dragNode.c._vy};renderCanvas()};
  const up=()=>{window.removeEventListener("pointermove",move);window.removeEventListener("pointerup",up);const d=dragNode;dragNode=null;if(!d)return;if(nodeMoved){
    const before={x:d.x,y:d.y},after={x:d.c._vx,y:d.c._vy};
    const entry={instance_id:d.c.instance_id,before,after,committed_revision:data?.latest_version?.data?.revision??0};
    persistVisual(entry.instance_id,after).then(()=>{entry.committed_revision=data?.latest_version?.data?.revision??entry.committed_revision;history.push(entry);future=[];if(history.length>50)history.shift();updateHistoryButtons()}).catch(()=>{});
  }};
  window.addEventListener("pointermove",move);window.addEventListener("pointerup",up,{once:true});
}
function applyPosition(entry,key){
  const c=findById(data.latest_version.data.root,entry.instance_id);if(!c)return null;const p=entry[key];
  c._vx=p.x;c._vy=p.y;c.visual={...(c.visual||{}),x:p.x,y:p.y};renderCanvas();return c
}
$("undo").onclick=()=>{const entry=history.pop();if(!entry)return;const c=applyPosition(entry,"before");if(!c){history.push(entry);return}future.push(entry);updateHistoryButtons();
  persistVisual(entry.instance_id,entry.before).catch(()=>{history.push(entry);future=future.filter(x=>x!==entry);updateHistoryButtons()})};
$("redo").onclick=()=>{const entry=future.pop();if(!entry)return;const c=applyPosition(entry,"after");if(!c){future.push(entry);return}history.push(entry);updateHistoryButtons();
  persistVisual(entry.instance_id,entry.after).catch(()=>{future.push(entry);history=history.filter(x=>x!==entry);updateHistoryButtons()})};
$("selectTool").onclick=()=>{mode="select";$("selectTool").classList.add("active");$("handTool").classList.remove("active");$("canvas").classList.remove("hand")};
$("handTool").onclick=()=>{mode="hand";$("handTool").classList.add("active");$("selectTool").classList.remove("active");$("canvas").classList.add("hand")};
$("fit").onclick=()=>{const {nodes}=graph();if(!nodes.length)return;const xs=nodes.map(n=>nodeBox(n.component));const minX=Math.min(...xs.map(b=>b.x)),maxX=Math.max(...xs.map(b=>b.x+76)),minY=Math.min(...xs.map(b=>b.y)),maxY=Math.max(...xs.map(b=>b.y+120));const k=Math.min(1.2,Math.max(.35,Math.min(1000/(maxX-minX+80),480/(maxY-minY+80))));view={k,x:80-minX*k,y:140-minY*k};renderCanvas()};
function zoomAt(f){const k=Math.min(2,Math.max(.25,view.k*f));const svg=$("canvas"),r=svg.getBoundingClientRect();const center=screenToCanvas(r.left+r.width/2,r.top+r.height/2);view.x=view.x+center.x*(view.k-k);view.y=view.y+center.y*(view.k-k);view.k=k;renderCanvas()}
$("zoomIn").onclick=()=>zoomAt(1.2);$("zoomOut").onclick=()=>zoomAt(1/1.2);
$("canvas").addEventListener("wheel",e=>{e.preventDefault();const p=screenToCanvas(e.clientX,e.clientY);const f=e.deltaY<0?1.1:1/1.1;const k=Math.min(2,Math.max(.25,view.k*f));view.x=view.x+p.x*(view.k-k);view.y=view.y+p.y*(view.k-k);view.k=k;renderCanvas()},{passive:false});
$("canvas").addEventListener("pointerdown",e=>{if(e.target.closest(".wnode"))return;pan={sx:e.clientX,sy:e.clientY,vx:view.x,vy:view.y,k:view.k};$("canvas").classList.add("grabbing")});
window.addEventListener("pointermove",e=>{if(!pan)return;const a=screenToSvg(pan.sx,pan.sy),b=screenToSvg(e.clientX,e.clientY);view.x=pan.vx+(b.x-a.x)/pan.k;view.y=pan.vy+(b.y-a.y)/pan.k;renderCanvas()});
window.addEventListener("pointerup",()=>{pan=null;$("canvas").classList.remove("grabbing")});
$("load").onclick=load;
</script>
