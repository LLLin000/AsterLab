<script>
let bootRequest=0;
async function bootLatestView(){
  const request=++bootRequest, projectId=document.getElementById('projectPicker').value, designId=document.getElementById('designPicker').value;
  const ctx=window.AsterPageCtx, state=await ctx.loadState();
  if(request!==bootRequest)return;
  const design=(state.records||[]).find(r=>r.kind==='design'&&r.id===designId&&r.project_id===projectId), d=design?.data||{};
  if(!projectId||!design){document.getElementById('viewId').value='';window.resetView();return}
  const protocolIds=new Set([...(d.assays||[]).map(a=>a.protocol_version_id),...(d.assays||[]).flatMap(a=>a.protocol_version_ids||[])].filter(Boolean));
  const views=(state.records||[]).filter(r=>r.kind==='view'&&r.project_id===projectId).sort((a,b)=>String(b.created_at||'').localeCompare(String(a.created_at||'')));
  for(const viewRecord of views){
    const response=await fetch(`/api/views/${encodeURIComponent(viewRecord.id)}`), result=await response.json();
    if(request!==bootRequest)return;
    if(!response.ok)continue;
    const root=result.latest_version?.data?.root, refs=new Set();
    const collect=component=>{if(!component)return;const scan=value=>{if(!value||typeof value!=='object')return;for(const [key,item] of Object.entries(value)){if(key==='protocol_version_id'&&item)refs.add(item);else if(key==='protocol_version_ids'&&Array.isArray(item))item.forEach(id=>id&&refs.add(id));else scan(item)}};scan(component)};
    collect(root);
    if([...protocolIds].some(id=>refs.has(id))){document.getElementById('canvasPanel').hidden=false;document.getElementById('detail').hidden=false;document.getElementById('detail').classList.remove("plan-empty");document.getElementById('viewId').value=viewRecord.id;await window.load();return}
  }
  document.getElementById('viewId').value='';
  window.resetView();
  document.getElementById('canvasPanel').hidden=true;
  document.getElementById('status').textContent='Plan 已保存';
  document.getElementById('detail').hidden=false;
  document.getElementById('detail').classList.add("plan-empty");
  document.getElementById('detail').innerHTML='<div class="empty-state"><h2>Plan</h2><p>此设计还没有可视化流程。上方的检测安排可直接用于开始运行；需要步骤图时再生成 View。</p></div>';
}
window.bootLatestView=bootLatestView;

</script>
