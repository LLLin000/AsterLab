<!doctype html>
<html lang="zh-CN" data-bs-theme="dark">
<head>

<link rel="stylesheet" href="/vendor/tabler/tabler.min.css">
<style>
:root{color-scheme:dark;--bg:var(--al-bg);--panel:var(--al-surface);--ink:var(--al-ink);--muted:var(--al-muted);--line:var(--al-line);--accent:var(--al-accent);--soft:var(--al-accent-soft);--canvas:var(--al-bg);--ok:var(--al-success)}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.55 var(--al-font)}
input,button,textarea,select{font:inherit;color:inherit}button{cursor:pointer;border:1px solid var(--al-line-strong);background:var(--panel);border-radius:7px;padding:6px 10px;min-height:32px}button:hover{background:var(--al-surface-2)}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}button:disabled{opacity:.4;cursor:default}
.shell{height:100vh;display:grid;grid-template-columns:56px minmax(0,1fr);overflow:hidden}.rail{background:#0d0f12;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:8px}.brand-row{padding:0;margin:0 0 10px}.brand{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#6878ff,#8d6bff);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:800}.brand-copy,.project-picker,.rail-foot,.rail-item span{display:none}.rail-nav{display:flex;flex-direction:column;gap:4px;width:100%;align-items:center}.rail-item{width:38px;height:38px;padding:0;border:0;background:transparent;border-radius:8px;display:grid;place-items:center;color:var(--muted)}.rail-item img{width:19px;height:19px;object-fit:contain;filter:grayscale(1);opacity:.7}.rail-item:hover{background:var(--al-surface-2);color:var(--ink)}.rail-item.active{background:var(--soft);color:var(--accent)}.rail-item.active img{filter:none;opacity:1}
main{min-width:0;min-height:0;height:100%;display:flex;flex-direction:column;gap:0;padding:0 24px;overflow:hidden}.topbar{height:56px;flex:0 0 56px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line)}.topbar-title{min-width:0}.workspace-title{font-size:12px;font-weight:600}.workspace-sub{font-size:10px;color:var(--muted)}.topbar-actions{display:flex;align-items:center;gap:8px;margin-left:auto}.status-pill{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:3px 8px}.devtools{position:relative}.devtools summary{cursor:pointer;list-style:none;font-size:12px;color:var(--muted);padding:6px 8px;border:1px solid var(--line);border-radius:7px}.devtools-pop{position:absolute;right:0;top:34px;z-index:20;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;width:340px;display:grid;gap:8px;box-shadow:0 10px 30px #0005}.devtools-pop label{display:grid;gap:4px;font-size:11px;color:var(--muted)}
.crumbs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding-top:8px}.crumb{background:var(--soft);border:0;border-radius:99px;padding:3px 9px;font-size:12px}.crumb-sep{color:var(--muted);font-size:11px}.row{display:flex;gap:6px}.muted{color:var(--muted);font-size:11px}
.workspace{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;flex:0 0 280px;height:280px;min-height:0;margin-top:12px}.workspace-head{position:absolute;z-index:2;left:16px;right:16px;top:12px;padding:0;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;pointer-events:none}.workspace-head>*{pointer-events:auto}.workspace-head .muted{font-size:10px}.panel-kicker{font-size:12px;font-weight:600;color:var(--ink)}.toolbar{position:absolute;z-index:2;left:14px;bottom:12px;display:flex;gap:2px;padding:3px;background:var(--panel);border:1px solid var(--line);border-radius:8px}.toolbar button{width:30px;height:28px;min-height:28px;padding:0;border:0;background:transparent;color:var(--muted);border-radius:5px}.toolbar button:hover,.toolbar button.active{background:var(--al-surface-2);color:var(--accent)}.canvas-wrap{position:absolute;inset:0;border:0;border-radius:0;background-color:var(--panel);background-image:radial-gradient(var(--al-line-strong) 1px,transparent 1px);background-size:16px 16px;overflow:hidden}#canvas{display:block;width:100%;height:100%;min-height:0;touch-action:none;cursor:grab}#canvas.hand{cursor:grab}#canvas.grabbing{cursor:grabbing}.zoom{position:absolute;right:14px;bottom:14px;font-size:10px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:3px 9px}
.grid-dot{fill:var(--al-line-strong)}.wnode{cursor:pointer;outline:none}.wnode .node-bg{fill:transparent;stroke:transparent;stroke-width:1;filter:none;transition:fill .12s,stroke .12s}.wnode:hover .node-bg{fill:var(--al-surface-2);stroke:var(--al-line-strong)}.wnode.selected .node-bg,.wnode.connect-target .node-bg{fill:var(--soft);stroke:var(--accent);stroke-width:1.5}.wnode .bioicon{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;color:var(--ink)}.wnode.selected .bioicon{color:var(--accent)}.wnode .cmp-flow__label,.wnode .label{font-size:13px;font-weight:600;fill:var(--ink);text-anchor:middle}.wnode .cmp-flow__kind,.wnode .kind{font-size:10px;fill:var(--muted);text-anchor:middle}.edge{fill:none;stroke:var(--al-line-strong);stroke-width:1.4;marker-end:url(#arrow)}.port{fill:var(--panel);stroke:var(--al-line-strong);stroke-width:1.2;pointer-events:none}.port-hit{cursor:crosshair}.wnode.selected .port{stroke:var(--accent);fill:var(--soft)}.edge.temp-edge{stroke:var(--accent);stroke-dasharray:4 3;marker-end:none}.empty{fill:var(--muted);font-size:13px;text-anchor:middle}
.detail{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;margin:10px 0 16px;flex:1 1 0;min-height:0;overflow:hidden;display:flex;flex-direction:column}.detail-head{flex:0 0 auto;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:16px 18px 12px;border-bottom:1px solid var(--line)}.detail-title{font-size:19px;font-weight:650;letter-spacing:-.02em}.detail-meta{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:4px}.detail-actions{display:flex;align-items:center;gap:4px}.detail-actions .quiet{background:transparent;border-color:transparent;color:var(--muted);padding:5px 8px;font-size:12px}.detail-actions .quiet:hover{background:var(--al-surface-2);color:var(--ink)}.param{display:flex;flex-direction:column;gap:2px;margin:8px 0}.param b{font-weight:550}.param span{color:var(--muted);font-size:12px}
.cards{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-auto-rows:min-content;gap:12px;align-items:start;flex:1 1 0;min-height:0;overflow:auto;padding:16px 18px 18px}.cards>.card[data-component="lab.well_plate"],.cards>.plate-card{grid-column:span 8}.cards>.card[data-component="tool.calculator"]{grid-column:span 4}.cards>.card[data-component="content.table"],.cards>.card[data-component="layout.table"],.cards>.card[data-component="content.note"],.cards>.card[data-component="content.markdown"]{grid-column:span 12}.card{margin:0;box-sizing:border-box;min-width:0;overflow:auto;display:flex;flex-direction:column;background:var(--al-surface-2);border:1px solid var(--line);border-radius:10px;padding:14px;box-shadow:none}.card h3{font-size:14px;line-height:1.35;margin:0 0 6px;padding-right:84px;display:flex;align-items:center;gap:8px}.card button{margin-top:7px;padding:4px 8px;font-size:11px}.card .tag{font-size:10px;color:var(--muted)}.card-actions{position:absolute;right:10px;top:10px;display:inline-flex;gap:2px}.card-actions button{width:28px;height:28px;padding:0;border:0;border-radius:6px;background:transparent;color:var(--muted)}.card-actions button:hover{background:var(--bg);color:var(--ink)}
.op-brief{grid-column:span 12;background:var(--al-surface);border:1px solid var(--al-line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}.op-brief-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.op-brief-head strong{font-size:13px}.op-brief-head span{display:block;color:var(--muted);font-size:10px;margin-top:2px}.op-brief-instruction{font-size:13px;line-height:1.6;white-space:pre-wrap}.op-brief-meta{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:10px}.op-brief-checks{list-style:none;padding:0;margin:2px 0 0;display:grid;gap:6px}.op-check{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--al-line);padding-top:6px;font-size:12px}.op-check small{color:var(--muted);font-size:10px}.op-check.is-blocking small{color:var(--al-warning)}
.plate{display:grid;gap:4px;margin:10px 0}.well{width:30px;height:30px;padding:0;border-radius:6px;border:1px solid var(--line);background:var(--al-surface);font-size:10px;color:var(--muted)}.well.assigned{background:var(--soft);border-color:var(--al-line-strong);color:var(--ink)}.well.selected{background:var(--accent);border-color:var(--accent);color:#fff}.well:disabled{opacity:.25;cursor:default}textarea{min-height:54px;resize:vertical}table{border-collapse:collapse;width:100%;font-size:12px;margin-top:8px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:6px 4px}th{color:var(--muted);font-weight:500}.editable-table input{min-height:34px;border:0;background:transparent;padding:6px 8px;border-radius:5px}.editable-table input:focus{background:var(--soft);outline:1px solid var(--accent)}.empty-card{font-size:12px;color:var(--muted);padding:10px 0}.md-preview{font-size:13px;line-height:1.65}.preview{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.library,.inbox,.proposal{position:absolute;right:16px;z-index:8;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel);box-shadow:0 8px 24px #0005}.library{bottom:16px;max-width:520px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}.library h3{width:100%;margin:0 0 2px}.library button{font-size:12px;padding:4px 8px}.inbox{top:58px;width:360px;max-height:60%;overflow:auto}.proposal{bottom:58px;width:360px;max-height:42%;overflow:auto}.inbox-head,.inbox-row{display:flex;align-items:center;gap:8px;font-size:12px}.inbox-row{padding:6px 0;border-top:1px solid var(--line)}.inbox-row>div{flex:1;min-width:0}.proposal-title{font-size:13px;font-weight:650}.proposal-empty{font-size:12px;color:var(--muted)}.diff-list{border-top:1px solid var(--line);margin:8px 0;padding-top:8px}.diff-row{display:flex;gap:10px;font-size:12px;padding:3px 0}.diff-row b{min-width:54px;color:var(--muted);font-weight:500}.diff-row span{overflow-wrap:anywhere}.agent-prompt{display:flex;gap:6px;margin:8px 0}.agent-prompt input{flex:1}.card.selected{outline:2px solid var(--accent);outline-offset:2px}#status{min-height:18px}
.workspace.compact{flex-basis:140px;height:140px}.workspace.compact .workspace-head{top:10px}.workspace.compact .workspace-head .muted{display:none}.workspace.compact .toolbar{bottom:8px}.workspace.compact .wnode{transform:translate(0,0) scale(.72);transform-box:fill-box;transform-origin:center}.workspace.compact #canvas{opacity:.9}.theme-toggle{width:32px;height:32px;padding:0;border-radius:8px;border-color:transparent;background:transparent;color:var(--muted)}
.cards>.calc-card{grid-column:span 4}.cards>.table-card,.cards>.note-card{grid-column:span 12}.cards>.card:not(.plate-card):not(.calc-card){grid-column:span 12}.card{overflow:visible}.workspace.compact .wnode{transform:none}.workspace.compact .workspace-head .muted{display:block}.rail-item img{filter:brightness(0) invert(.65);opacity:1}.rail-item.active img{filter:brightness(0) invert(.76) sepia(.24) saturate(3) hue-rotate(195deg)}
html[data-bs-theme="light"]{color-scheme:light}html[data-bs-theme="dark"]{color-scheme:dark}
@media(max-width:900px){main{padding:0 12px}.cards{grid-template-columns:repeat(12,minmax(0,1fr))}.cards>.card{grid-column:span 12!important}.workspace{flex-basis:240px;height:240px}.workspace.compact{flex-basis:140px;height:140px}.detail-title{font-size:16px}}

.page-view{flex:1 1 0;min-height:0;overflow:auto;padding:16px 0 24px}.page-view[hidden]{display:none}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}.page-head h1{font-size:22px;margin:0;letter-spacing:-.02em}.page-head p{margin:4px 0 0;color:var(--muted);font-size:12px}.page-tools{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.page-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}.page-card{grid-column:span 12;background:var(--al-surface);border:1px solid var(--al-line);border-radius:10px;padding:14px;min-width:0}.page-card h2{font-size:14px;margin:0 0 10px}.page-card h3{font-size:12px;margin:0 0 8px}.page-card.half{grid-column:span 6}.page-card.third{grid-column:span 4}.page-list{display:grid;gap:7px}.page-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--al-line)}.page-row:first-child{border-top:0;padding-top:0}.page-row strong{font-size:12px}.page-row small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.page-muted{color:var(--muted);font-size:11px}.page-map{display:grid;grid-template-columns:minmax(160px,1fr) 28px minmax(180px,1.2fr) 28px minmax(160px,1fr);gap:8px;align-items:start}.page-col{display:grid;gap:7px}.page-col-title{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}.map-node{border:1px solid var(--al-line);border-radius:9px;background:var(--al-surface-2);padding:9px;min-width:0}.map-node strong{display:block;font-size:12px}.map-node small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.map-arrow{display:grid;place-items:center;color:var(--al-muted);font-size:18px;padding-top:22px}.step-strip{display:flex;gap:8px;overflow:auto;padding:4px 0 12px}.step-chip{flex:none;border:1px solid var(--al-line);background:var(--al-surface);border-radius:9px;padding:8px 10px;color:var(--al-muted);font-size:12px}.step-chip.active{border-color:var(--al-accent);background:var(--al-accent-soft);color:var(--al-ink)}.step-chip small{display:block;font-size:9px;color:var(--al-muted);margin-top:2px}.data-table-wrap{overflow:auto}.page-view table{width:100%;border-collapse:collapse;font-size:11px}.page-view th,.page-view td{text-align:left;border-bottom:1px solid var(--al-line);padding:7px 5px}.page-view th{color:var(--al-muted);font-weight:500}.page-view .empty-state{padding:40px;text-align:center;color:var(--al-muted);border:1px dashed var(--al-line);border-radius:12px}.page-view .empty-state h2{color:var(--al-ink);margin:0 0 6px;font-size:16px}.page-view .btn{height:30px;padding:0 10px;border:1px solid var(--al-line-strong);border-radius:7px;background:var(--al-surface);color:var(--al-ink);font-size:11px;cursor:pointer}.page-view .btn.primary{background:var(--al-accent);border-color:var(--al-accent);color:#fff}.page-view .btn.ghost{background:transparent}
@media(max-width:850px){.page-card.half,.page-card.third{grid-column:span 12}.page-map{grid-template-columns:1fr}.map-arrow{display:none}}
</style>
<link rel="stylesheet" href="/components/tokens.css">
<link rel="stylesheet" href="/components/wellplate.css">

<body>
<div class="shell">
<aside class="rail">
  <div class="brand-row"><div class="brand" title="AsterLab">AL</div><div class="brand-copy"><strong>AsterLab</strong><span>实验工作台</span></div></div>
  <label class="project-picker"><span>项目</span><select aria-label="当前项目"><option>CCK-8 assay</option><option>L929 culture</option><option>Biofilm CV</option></select></label>
  <nav class="rail-nav" aria-label="主导航">
    <button class="rail-item active" data-page="designs" title="实验设计" aria-label="实验设计"><img src="/icons/plate.svg" alt=""><span>实验设计</span></button>
    <button class="rail-item" data-page="protocols" title="Protocol" aria-label="Protocol"><img src="/icons/pipette.svg" alt=""><span>Protocol</span></button>
    <button class="rail-item" data-page="runs" title="实验运行" aria-label="实验运行"><img src="/icons/incubator.svg" alt=""><span>实验运行</span></button>
    <button class="rail-item" data-page="tools" title="资料与工具" aria-label="资料与工具"><img src="/icons/flask.svg" alt=""><span>资料与工具</span></button>
  </nav>
  <div class="rail-foot muted">本地工作区<br>SQLite · 127.0.0.1</div>
</aside>
<main>
  <header class="topbar">
    <div class="topbar-title">
      <div class="workspace-title" id="workspaceTitle">CCK-8 Assay</div>
      <div class="workspace-sub" id="workspaceSub">Design draft · View v1</div>
    </div>
    <div class="topbar-actions">
      <span id="status" class="status-pill" role="status">就绪</span>
      <button id="themeToggle" class="theme-toggle" type="button" title="切换主题" aria-label="切换主题">◐</button>
      <details class="devtools"><summary>开发</summary><div class="devtools-pop"><label>View ID<input id="viewId" placeholder="View ID" aria-label="View ID"></label><button class="primary" id="openView">打开视图</button></div></details>
    </div>
  </header>
  <div class="crumbs" id="crumbs"></div>
  <section class="workspace" id="canvasPanel">
    <div class="workspace-head">
      <div>
        <div class="panel-kicker">实验设计流程</div>
        <div class="muted">连线仅表示 View 关系，不修改 Protocol 顺序或样本</div>
      </div>
      <div class="row">
        <button id="collapseWorkflow" type="button" aria-expanded="true" title="收起流程">收起流程</button>
        <button id="undo" title="撤销布局" disabled>↶</button>
        <button id="redo" title="重做布局" disabled>↷</button>
      </div>
    </div>
    <div class="toolbar" role="toolbar" aria-label="画布工具">
      <button id="selectTool" class="active" title="选择">↖</button>
      <button id="handTool" title="平移">✋</button>
      <button id="fit" title="适应屏幕">⤢</button>
      <button id="zoomIn" title="放大">＋</button>
      <button id="zoomOut" title="缩小">−</button>
    </div>
    <div class="canvas-wrap">
      <svg id="canvas" viewBox="0 0 1100 360" preserveAspectRatio="xMidYMid meet" role="img" aria-label="实验流程画布"></svg>
      <div class="zoom" id="zoomLabel">100%</div>
    </div>
  </section>
  <section class="detail" id="detail"><div class="muted">选择一个步骤查看详情。</div></section>
  <section id="page-view" class="page-view" hidden></section>
</main>
</div>
<script src="/icons/inline.js"></script>
<script src="/vendor/dagre.js"></script>
<script src="/layout.js"></script>

<script src="/vendor/purify.js"></script>
<script src="/vendor/tabler/tabler.min.js"></script>
<script src="/app.js"></script>
<script src="/components/wellplate.js"></script>
<script src="/components/table.js"></script>
<script src="/components/calculator.js"></script>
<script src="/components/flow.js"></script>
<script src="/components/markdown.js"></script>
<script src="/components/proposal.js"></script>
<script src="/pages/design.js"></script>
<script src="/pages/protocol.js"></script>
<script src="/pages/run.js"></script>
<script src="/pages.js"></script>
<script>
async function bootLatestView(){
  try{
    const state=await window.AsterPageCtx.loadState();
    const views=(state.records||[]).filter(r=>r.kind==='view').sort((a,b)=>String(b.created_at||'').localeCompare(String(a.created_at||'')));
    if(!views.length){
      document.getElementById('status').textContent='尚无 View';
      document.getElementById('detail').innerHTML='<div class="empty-state"><h2>还没有可打开的设计视图</h2><p>先在功能工作台创建设计与 Protocol，再由 Agent 或视图工具生成 ViewDocument。</p><a class="btn primary" href="/workspace?view=designs">打开功能工作台</a></div>';
      return;
    }
    document.getElementById('viewId').value=views[0].id;
    await load();
  }catch(error){document.getElementById('status').textContent='读取失败：'+(error.message||error)}
}
const initialPage = new URLSearchParams(location.search).get("page");
if (initialPage === "workflow") bootLatestView();
</script>
</body>
</html>
