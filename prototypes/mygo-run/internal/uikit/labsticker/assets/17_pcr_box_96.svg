      <ellipse cx="242" cy="151" rx="9.5" ry="5.2" fill="#10B981" stroke="#047857" stroke-width="1.4"/>
      <ellipse cx="268" cy="162" rx="9.5" ry="5.2" fill="#34D399" stroke="#047857" stroke-width="1.4"/>
      <!-- Row B strip (Indigo optical caps) -->
      <ellipse cx="136" cy="198" rx="9.5" ry="5.2" fill="#6366F1" stroke="#4338CA" stroke-width="1.4"/>
      <ellipse cx="162" cy="209" rx="9.5" ry="5.2" fill="#6366F1" stroke="#4338CA" stroke-width="1.4"/>
