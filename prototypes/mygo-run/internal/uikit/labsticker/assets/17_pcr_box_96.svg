      <ellipse cx="214" cy="187" rx="9.5" ry="5.2" fill="#6366F1" stroke="#4338CA" stroke-width="1.4"/>
      <ellipse cx="240" cy="176" rx="9.5" ry="5.2" fill="#6366F1" stroke="#4338CA" stroke-width="1.4"/>
      <ellipse cx="294" cy="174" rx="9.5" ry="5.2" fill="#818CF8" stroke="#4338CA" stroke-width="1.4"/>
      <ellipse cx="320" cy="186" rx="9.5" ry="5.2" fill="#818CF8" stroke="#4338CA" stroke-width="1.4"/>
      <!-- Row C & D individual PCR tubes (Violet / Amber) -->
      <ellipse cx="188" cy="224" rx="9.5" ry="5.2" fill="#F59E0B" stroke="#B45309" stroke-width="1.4"/>
      <ellipse cx="214" cy="213" rx="9.5" ry="5.2" fill="#F59E0B" stroke="#B45309" stroke-width="1.4"/>
      <ellipse cx="240" cy="202" rx="9.5" ry="5.2" fill="#F59E0B" stroke="#B45309" stroke-width="1.4"/>
      <ellipse cx="266" cy="191" rx="9.5" ry="5.2" fill="#F59E0B" stroke="#B45309" stroke-width="1.4"/>
      <ellipse cx="222" cy="242" rx="9.5" ry="5.2" fill="#EC4899" stroke="#9D174D" stroke-width="1.4"/>
      <ellipse cx="248" cy="231" rx="9.5" ry="5.2" fill="#EC4899" stroke="#9D174D" stroke-width="1.4"/>
      <ellipse cx="274" cy="220" rx="9.5" ry="5.2" fill="#EC4899" stroke="#9D174D" stroke-width="1.4"/>
      <ellipse cx="300" cy="209" rx="9.5" ry="5.2" fill="#14B8A6" stroke="#0F766E" stroke-width="1.4"/>
      <ellipse cx="326" cy="198" rx="9.5" ry="5.2" fill="#14B8A6" stroke="#0F766E" stroke-width="1.4"/>
      <ellipse cx="256" cy="260" rx="9.5" ry="5.2" fill="#8B5CF6" stroke="#5B21B6" stroke-width="1.4"/>
      <ellipse cx="282" cy="249" rx="9.5" ry="5.2" fill="#8B5CF6" stroke="#5B21B6" stroke-width="1.4"/>
      <ellipse cx="308" cy="238" rx="9.5" ry="5.2" fill="#8B5CF6" stroke="#5B21B6" stroke-width="1.4"/>
      <ellipse cx="334" cy="227" rx="9.5" ry="5.2" fill="#38BDF8" stroke="#0369A1" stroke-width="1.4"/>
      <ellipse cx="360" cy="216" rx="9.5" ry="5.2" fill="#38BDF8" stroke="#0369A1" stroke-width="1.4"/>
    </g>
    <!-- Clear protective lid top cover -->
    <path d="M 54,208 L 248,126 C 255,123 263,123 270,126 L 446,208 L 446,222 L 248,314 L 54,222 Z"
          fill="url(#pcrBoxLid)" stroke="#6D28D9" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M 100,196 L 254,134 L 316,162" fill="none" stroke="#FFFFFF" stroke-width="4.2" stroke-linecap="round" opacity="0.82"/>
    <path d="M 248,314 L 248,402" fill="none" stroke="#FFFFFF" stroke-width="2.0" opacity="0.52"/>
  </g>
