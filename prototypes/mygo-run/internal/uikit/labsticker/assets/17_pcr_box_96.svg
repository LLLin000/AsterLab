<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <linearGradient id="pcrBoxFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="55%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#5B21B6"/>
    </linearGradient>
    <linearGradient id="pcrBoxSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DDD6FE"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="pcrBoxDeck" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5FF"/>
      <stop offset="100%" stop-color="#EDE9FE"/>
    </linearGradient>
    <linearGradient id="pcrBoxLid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#C4B5FD" stop-opacity="0.44"/>
    </linearGradient>
  </defs>
  <g>
    <!-- 96-well skirted PCR rack & hinged translucent lid -->
    <!-- Right angled skirt wall -->
    <path d="M 442,216 L 442,302 C 442,309 437,315 431,318 L 248,404 L 248,308 Z"
          fill="url(#pcrBoxSide)" stroke="#4C1D95" stroke-width="2.6" stroke-linejoin="round"/>
    <!-- Front angled skirt wall -->
    <path d="M 58,216 L 248,308 L 248,404 C 242,407 235,406 229,403 L 66,318 C 61,315 58,309 58,302 Z"
          fill="url(#pcrBoxFront)" stroke="#4C1D95" stroke-width="2.6" stroke-linejoin="round"/>
    <!-- Front label badge -->
    <path d="M 108,268 L 194,308 L 194,336 L 108,296 Z"
          fill="#FFFFFF" fill-opacity="0.88" stroke="#6D28D9" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- Top 96-well deck -->
    <path d="M 58,216 L 248,136 C 254,133 262,133 268,136 L 442,216 L 248,308 Z"
          fill="url(#pcrBoxDeck)" stroke="#4C1D95" stroke-width="2.6" stroke-linejoin="round"/>
    <!-- Visible 8-well PCR tube strips & primer tubes arranged in rows -->
    <g>
      <!-- Row A strip (Emerald SYBR caps) -->
      <ellipse cx="164" cy="184" rx="9.5" ry="5.2" fill="#10B981" stroke="#047857" stroke-width="1.4"/>
      <ellipse cx="190" cy="173" rx="9.5" ry="5.2" fill="#10B981" stroke="#047857" stroke-width="1.4"/>
