    <g stroke="#1E40AF" stroke-width="1.35" stroke-opacity="0.32" stroke-linecap="round">
      <line x1="209" y1="102" x2="209" y2="127"/>
      <line x1="216" y1="102" x2="216" y2="127"/>
      <line x1="223" y1="102" x2="223" y2="127"/>
      <line x1="230" y1="102" x2="230" y2="127"/>
      <line x1="237" y1="102" x2="237" y2="127"/>
      <line x1="244" y1="102" x2="244" y2="127"/>
      <line x1="251" y1="102" x2="251" y2="127"/>
      <line x1="258" y1="102" x2="258" y2="127"/>
      <line x1="265" y1="102" x2="265" y2="127"/>
      <line x1="272" y1="102" x2="272" y2="127"/>
      <line x1="279" y1="102" x2="279" y2="127"/>
      <line x1="286" y1="102" x2="286" y2="127"/>
      <line x1="293" y1="102" x2="293" y2="127"/>
    </g>
    <rect x="206" y="100" width="14" height="26" rx="2" fill="#FFFFFF" fill-opacity="0.22"/>
  </g>
</svg>
