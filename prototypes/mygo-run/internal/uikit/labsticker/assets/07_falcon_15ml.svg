<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <linearGradient id="tubeFrost" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="28%" stop-color="#FFFFFF"/>
      <stop offset="72%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="liquidFill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="35%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="28%" stop-color="#60A5FA"/>
      <stop offset="75%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
  </defs>
  <g transform="translate(250,0) scale(0.660, 1) translate(-250,0)">
    <!-- Conical PP barrel outer shape from BIOART-708 -->
    <path d="M 209.5,123 L 290.5,123 L 290.5,356 C 290.5,358.8 289.7,361.4 288.2,363.6 L 261.7,402.4 C 260.1,404.6 257.6,406 254.8,406 L 245.2,406 C 242.4,406 239.9,404.6 238.3,402.4 L 211.8,363.6 C 210.3,361.4 209.5,358.8 209.5,356 Z"
          fill="url(#tubeFrost)" stroke="#475569" stroke-width="2.6" stroke-linejoin="round"/>
    <!-- Translucent Liquid Column -->
    <path d="M 213.5,188 L 286.5,188 L 286.5,355.5 C 286.5,357.5 285.9,359.5 284.7,361.2 L 259.6,398.1 C 258.5,399.8 256.7,400.8 254.6,400.8 L 245.4,400.8 C 243.3,400.8 241.5,399.8 240.4,398.1 L 215.3,361.2 C 214.1,359.5 213.5,357.5 213.5,355.5 Z"
