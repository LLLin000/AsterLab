    <ellipse cx="250" cy="188" rx="36.5" ry="6.2" fill="#7DD3FC" fill-opacity="0.95"/>
    <ellipse cx="250" cy="188" rx="36.5" ry="6.2" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.55"/>
    <!-- Frosted labeling area (left wall) -->
    <rect x="217" y="166" width="22" height="122" rx="4" fill="#FFFFFF" fill-opacity="0.65"/>
    <!-- Graduation scale ticks (right wall) -->
    <g stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" opacity="0.92">
      <line x1="262" y1="165" x2="282" y2="165"/>
      <line x1="269" y1="186" x2="282" y2="186"/>
      <line x1="262" y1="207" x2="282" y2="207"/>
      <line x1="269" y1="228" x2="282" y2="228"/>
      <line x1="262" y1="249" x2="282" y2="249"/>
      <line x1="269" y1="270" x2="282" y2="270"/>
      <line x1="262" y1="291" x2="282" y2="291"/>
      <line x1="269" y1="312" x2="282" y2="312"/>
      <line x1="262" y1="333" x2="282" y2="333"/>
    </g>
    <!-- Soft specular barrel gleam -->
    <path d="M 218,136 L 218,354 L 240,390" fill="none" stroke="#FFFFFF" stroke-width="4.2" stroke-linecap="round" opacity="0.52"/>
    <!-- Screw Cap from BIOART-708 (no mix-blend-mode) -->
    <path d="M 206,94 L 294,94 C 296.8,94 299,96.2 299,99 L 299,129 L 201,129 L 201,99 C 201,96.2 203.2,94 206,94 Z"
