<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <linearGradient id="petWall" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="22%" stop-color="#FFFFFF"/>
      <stop offset="76%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="dmemLiquid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="32%" stop-color="#FDA4AF"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <linearGradient id="mediaCap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="28%" stop-color="#FB7185"/>
      <stop offset="80%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <clipPath id="mediaClip">
      <path d="M 218,136 L 282,136 L 284,152 L 318,176 C 325,181 328,189 328,198 L 328,380 C 328,393 317,402 302,402 L 198,402 C 183,402 172,393 172,380 L 172,198 C 172,189 175,181 182,176 L 216,152 Z"/>
    </clipPath>
  </defs>
  <g>
    <!-- Faceted Square PET Media Bottle Body -->
    <path d="M 218,136 L 282,136 L 284,152 L 318,176 C 325,181 328,189 328,198 L 328,380 C 328,393 317,402 302,402 L 198,402 C 183,402 172,393 172,380 L 172,198 C 172,189 175,181 182,176 L 216,152 Z"
          fill="url(#petWall)"/>
    <g clip-path="url(#mediaClip)">
      <!-- Luminous Phenol-Red DMEM Media up to shoulder -->
      <rect x="166" y="196" width="168" height="214" fill="url(#dmemLiquid)" fill-opacity="0.88"/>
      <ellipse cx="250" cy="196" rx="79" ry="7.5" fill="#FECDD3"/>
      <ellipse cx="250" cy="196" rx="79" ry="7.5" fill="none" stroke="#FFFFFF" stroke-width="1.3" stroke-opacity="0.7"/>
      <!-- Facet vertical panel tint on left bevel for authentic square bottle depth -->
      <rect x="172" y="180" width="22" height="224" fill="#FFFFFF" fill-opacity="0.18"/>
      <rect x="304" y="180" width="24" height="224" fill="#0F172A" fill-opacity="0.06"/>
      <!-- Clean Wrap Media Label -->
      <rect x="178" y="232" width="144" height="106" rx="6" fill="#FFFFFF" fill-opacity="0.94" stroke="#CBD5E1" stroke-width="1.0"/>
      <rect x="178" y="248" width="144" height="14" fill="#F43F5E"/>
      <rect x="200" y="280" width="96" height="7" rx="3.5" fill="#475569" fill-opacity="0.22"/>
      <rect x="214" y="298" width="68" height="5" rx="2.5" fill="#475569" fill-opacity="0.15"/>
    </g>
    <!-- Facet inner bevel edge lines -->
    <line x1="194" y1="184" x2="194" y2="396" stroke="#FFFFFF" stroke-width="2.0" stroke-opacity="0.5"/>
    <line x1="306" y1="184" x2="306" y2="396" stroke="#64748B" stroke-width="1.3" stroke-opacity="0.25"/>
    <!-- Side volumetric ticks -->
    <g stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.85">
      <line x1="298" y1="214" x2="314" y2="214"/>
      <line x1="304" y1="354" x2="314" y2="354"/>
      <line x1="298" y1="372" x2="314" y2="372"/>
    </g>
    <!-- Outer Square PET Contour -->
    <path d="M 218,136 L 282,136 L 284,152 L 318,176 C 325,181 328,189 328,198 L 328,380 C 328,393 317,402 302,402 L 198,402 C 183,402 172,393 172,380 L 172,198 C 172,189 175,181 182,176 L 216,152 Z"
          fill="none" stroke="#475569" stroke-width="2.8" stroke-linejoin="round"/>
    <!-- Left gloss reflection -->
    <path d="M 183,194 L 183,378" fill="none" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" opacity="0.62"/>
    <!-- Tamper-evident Neck Ring -->
    <rect x="210" y="128" width="80" height="10" rx="4" fill="#FDA4AF" stroke="#9F1239" stroke-width="2.0"/>
    <!-- Ribbed Sterile Screw Cap -->
    <path d="M 211,88 C 211,81 289,81 289,88 L 289,126 C 289,130 211,130 211,126 Z"
          fill="url(#mediaCap)" stroke="#9F1239" stroke-width="2.6" stroke-linejoin="round"/>
    <ellipse cx="250" cy="88" rx="39" ry="6.5" fill="#FDA4AF" stroke="#9F1239" stroke-width="1.8"/>
    <g stroke="#9F1239" stroke-width="1.5" stroke-opacity="0.34" stroke-linecap="round">
      <line x1="219" y1="95" x2="219" y2="123"/>
      <line x1="227" y1="96" x2="227" y2="124"/>
      <line x1="235" y1="97" x2="235" y2="125"/>
      <line x1="243" y1="97" x2="243" y2="125"/>
      <line x1="251" y1="97" x2="251" y2="125"/>
      <line x1="259" y1="97" x2="259" y2="125"/>
      <line x1="267" y1="97" x2="267" y2="125"/>
      <line x1="275" y1="96" x2="275" y2="124"/>
      <line x1="281" y1="95" x2="281" y2="123"/>
    </g>
    <rect x="219" y="94" width="10" height="28" rx="3" fill="#FFFFFF" fill-opacity="0.25"/>
  </g>
</svg>
