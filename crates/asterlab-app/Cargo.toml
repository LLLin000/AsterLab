[package]
name = "asterlab-app"
version = "0.1.0"
edition = "2021"

[dependencies]
asterlab-core = { path = "../asterlab-core" }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
