<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Docs — AsterLab</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%236c5ce7' d='M16 3 28 26H21.5L16 14.5 10.5 26H4L16 3Z'/%3E%3C/svg%3E" />
<style>
:root {
  --bg: #ffffff;
  --bg-elev: #f5f6f8;
  --fg: #14151a;
  --fg-dim: #4c515f;
  --fg-faint: #848b9c;
  --rule: rgba(20, 21, 26, 0.08);
  --rule-strong: rgba(20, 21, 26, 0.16);
  --accent: #6c5ce7;
  --accent-2: #0ea5e9;
  --selection: rgba(108, 92, 231, 0.16);
  --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
html[data-theme="dark"] {
  --bg: #08090c;
  --bg-elev: #12141a;
  --fg: #f4f5f8;
  --fg-dim: #b4bac9;
  --fg-faint: #767d90;
  --rule: rgba(255, 255, 255, 0.08);
  --rule-strong: rgba(255, 255, 255, 0.16);
  --accent: #a596ff;
  --accent-2: #67e8f9;
  --selection: rgba(165, 150, 255, 0.24);
}
*, *::before, *::after { box-sizing: border-box; }
html {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  scroll-behavior: smooth;
}
body { margin: 0; overflow-x: clip; }
::selection { background: var(--selection); color: var(--fg); }

a { color: inherit; text-decoration: none; }

/* OMP-inspired Topbar: fixed 56px, hairline bottom, clean zero-clutter actions */
.topbar {
  position: fixed;
  inset-inline: 0;
  top: 0;
  z-index: 40;
  height: 56px;
  background: color-mix(in srgb, var(--bg) 96%, transparent);
  border-bottom: 1px solid var(--rule);
}
.topbar-inner {
  max-width: 1280px;
  height: 100%;
  margin: 0 auto;
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -0.02em;
}
.brand-sep { color: var(--fg-faint); font-weight: 400; }
.brand-sub {
  font-family: var(--font-mono);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  color: var(--accent);
  font-weight: 500;
}
.top-nav { display: flex; align-items: center; gap: 18px; }
.top-link {
  font-family: var(--font-mono);
  font-size: 11.5px;
  text-transform: uppercase;
  letter-spacing: 0.16em;
  color: var(--fg-dim);
  transition: color 0.15s;
}
.top-link:hover { color: var(--fg); }
.icon-btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  background: none;
  border: 1px solid transparent;
  color: var(--fg-dim);
  cursor: pointer;
  padding: 5px 8px;
  font-family: var(--font-mono);
  font-size: 11.5px;
  transition: color 0.15s, border-color 0.15s;
}
.icon-btn:hover { color: var(--fg); border-color: var(--rule-strong); }
.kbd {
  font-size: 10px;
  padding: 1px 5px;
  border: 1px solid var(--rule-strong);
  color: var(--fg-faint);
}

/* 3-Column Documentation Grid matching omp.sh/docs */
.shell {
  max-width: 1280px;
  margin: 0 auto;
  padding: 88px 24px 96px;
  display: grid;
  grid-template-columns: 14rem minmax(0, 1fr) 12.5rem;
  gap: 48px;
  align-items: start;
}
.sidebar-left {
  position: sticky;
  top: 84px;
  max-height: calc(100vh - 104px);
  overflow-y: auto;
  font-size: 13.5px;
  line-height: 1.5;
}
.sidebar-eyebrow {
  font-family: var(--font-mono);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.24em;
  color: var(--fg-faint);
  margin-bottom: 18px;
}
.nav-group { margin-bottom: 24px; }
.nav-group-title {
  font-family: var(--font-mono);
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 0.2em;
  color: var(--accent);
  margin-bottom: 10px;
  font-weight: 500;
}
.nav-list {
  list-style: none;
  margin: 0;
  padding: 0;
  border-left: 1px solid var(--rule);
}
.nav-item a {
  display: block;
  margin-left: -1px;
  border-left: 1px solid transparent;
  padding: 4px 0 4px 14px;
  color: var(--fg-dim);
  transition: color 0.15s, border-color 0.15s;
}
.nav-item a:hover {
  color: var(--fg);
  border-left-color: var(--rule-strong);
}
.nav-item a.active {
  color: var(--fg);
  border-left-color: var(--accent);
  font-weight: 500;
}

.sidebar-right {
  position: sticky;
  top: 84px;
  max-height: calc(100vh - 104px);
  overflow-y: auto;
  font-size: 12.5px;
}
.toc-list {
  list-style: none;
  margin: 0;
  padding: 0;
  border-left: 1px solid var(--rule);
}
.toc-item a {
  display: block;
  margin-left: -1px;
  border-left: 1px solid transparent;
  padding: 3px 0 3px 12px;
  color: var(--fg-faint);
  transition: color 0.15s, border-color 0.15s;
}
.toc-item.lvl-3 a { padding-left: 22px; font-size: 12px; }
.toc-item a:hover { color: var(--fg-dim); }
.toc-item a.active {
  color: var(--fg);
  border-left-color: var(--accent);
}

/* Main Editorial Prose */
.main-col { min-width: 0; }
.doc-kicker {
  font-family: var(--font-mono);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.22em;
  color: var(--accent);
  margin-bottom: 12px;
}
.prose {
  --prose-measure: 70ch;
  color: var(--fg);
  font-size: 15.5px;
  line-height: 1.72;
}
.prose > * + * { margin-top: 1.15em; }
.prose p, .prose ul, .prose ol, .prose blockquote {
  max-width: var(--prose-measure);
  color: var(--fg-dim);
}
.prose h1 {
  font-size: clamp(1.85rem, 1.5rem + 1vw, 2.35rem);
  font-weight: 600;
  letter-spacing: -0.03em;
  line-height: 1.15;
  margin: 0 0 0.75em;
  color: var(--fg);
}
.prose h2 {
  font-size: clamp(1.32rem, 1.15rem + 0.5vw, 1.65rem);
  font-weight: 500;
  letter-spacing: -0.02em;
  line-height: 1.22;
  color: var(--fg);
  border-top: 1px solid var(--rule);
  margin-top: 2.3em;
  padding-top: 1.15em;
  scroll-margin-top: 5.2rem;
}
.prose h2:first-of-type { margin-top: 1.6em; }
.prose h3 {
  font-size: 1.15rem;
  font-weight: 500;
  line-height: 1.3;
  color: var(--fg);
  margin-top: 1.75em;
  scroll-margin-top: 5.2rem;
}
.prose h4 {
  font-family: var(--font-mono);
  font-size: 12.5px;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--fg-faint);
  margin-top: 1.5em;
  scroll-margin-top: 5.2rem;
}
.anchor { color: var(--fg-faint); opacity: 0; margin-right: 6px; font-weight: 400; text-decoration: none !important; }
.prose h2:hover .anchor, .prose h3:hover .anchor, .prose h4:hover .anchor { opacity: 0.8; }

.prose strong { color: var(--fg); font-weight: 600; }
.prose a {
  color: var(--fg);
  text-decoration: underline;
  text-decoration-color: color-mix(in srgb, var(--accent) 58%, transparent);
  text-underline-offset: 3px;
  text-decoration-thickness: 1px;
  transition: text-decoration-color 0.15s;
}
.prose a:hover { text-decoration-color: var(--accent); }
.prose ul, .prose ol { padding-left: 1.25em; }
.prose li + li { margin-top: 0.35em; }
.prose ul li::marker { color: var(--accent); content: "— "; }

.prose code {
  font-family: var(--font-mono);
  background: var(--bg-elev);
  border: 1px solid var(--rule);
  color: var(--fg);
  padding: 0.08em 0.36em;
  font-size: 0.86em;
}
.prose pre {
  font-family: var(--font-mono);
  background: var(--bg-elev);
  border: 1px solid var(--rule);
  color: var(--fg);
  padding: 1rem 1.15rem;
  font-size: 13px;
  line-height: 1.65;
  overflow-x: auto;
}
.prose pre code { background: none; border: 0; padding: 0; font-size: inherit; }

.callout {
  max-width: var(--prose-measure);
  border-left: 2px solid var(--accent);
  background: var(--bg-elev);
  padding: 0.9rem 1.1rem;
  font-size: 14.5px;
  color: var(--fg-dim);
}
.callout-title {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 4px;
  font-weight: 600;
}
blockquote {
  margin-inline: 0;
  border-left: 2px solid var(--rule-strong);
  padding: 0.25rem 0 0.25rem 1rem;
}

.mermaid-wrap {
  border: 1px solid var(--rule);
  background: var(--bg-elev);
  padding: 16px;
  overflow-x: auto;
  text-align: center;
}

.table-scroll { overflow-x: auto; }
table.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}
table.data-table th, table.data-table td {
  border-bottom: 1px solid var(--rule);
  padding: 10px 12px;
  text-align: left;
  vertical-align: top;
}
table.data-table th {
  font-family: var(--font-mono);
  font-size: 11.5px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--fg-faint);
  border-bottom-color: var(--rule-strong);
}

/* Crisp multi-column Gallery Grid replacing awkward bordered HTML tables */
.gallery-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 14px;
  margin: 18px 0;
}
figure.shot {
  margin: 0;
  cursor: zoom-in;
  border: 1px solid var(--rule);
  background: var(--bg-elev);
  transition: border-color 0.15s;
  content-visibility: auto;
  contain-intrinsic-size: auto 240px;
}
figure.shot:hover { border-color: var(--rule-strong); }
figure.shot img {
  width: 100%;
  height: auto;
  display: block;
  object-fit: contain;
  max-height: 440px;
  background: var(--bg);
}
figure.shot figcaption {
  padding: 8px 10px;
  font-size: 12px;
  color: var(--fg-dim);
  border-top: 1px solid var(--rule);
}

/* Page Footer Prev/Next Navigation */
.pager {
  margin-top: 56px;
  padding-top: 24px;
  border-top: 1px solid var(--rule);
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}
.pager-card {
  display: block;
  border: 1px solid var(--rule);
  padding: 14px 16px;
  transition: border-color 0.15s, background 0.15s;
}
.pager-card:hover { border-color: var(--rule-strong); background: var(--bg-elev); }
.pager-card.next { text-align: right; }
.pager-dir {
  font-family: var(--font-mono);
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  color: var(--fg-faint);
  margin-bottom: 4px;
}
.pager-title { font-size: 14.5px; font-weight: 500; color: var(--fg); }

/* Search Command Modal (Ctrl+K) */
#cmdModal {
  position: fixed;
  inset: 0;
  z-index: 90;
  display: none;
  align-items: flex-start;
  justify-content: center;
  padding-top: 14vh;
  background: rgba(0, 0, 0, 0.56);
}
#cmdModal.open { display: flex; }
.cmd-panel {
  width: min(560px, 92vw);
  background: var(--bg);
  border: 1px solid var(--rule-strong);
  box-shadow: 0 24px 64px rgba(0, 0, 0, 0.35);
}
.cmd-input {
  width: 100%;
  padding: 14px 16px;
  border: 0;
  border-bottom: 1px solid var(--rule);
  background: transparent;
  color: var(--fg);
  font-size: 14.5px;
  outline: none;
}
.cmd-results { max-height: 340px; overflow-y: auto; padding: 6px; }
.cmd-item {
  display: flex;
  justify-content: space-between;
  padding: 9px 12px;
  font-size: 13.5px;
  cursor: pointer;
}
.cmd-item:hover { background: var(--bg-elev); }
.cmd-group { font-family: var(--font-mono); font-size: 11px; color: var(--fg-faint); }

/* Lightbox */
#lightbox {
  position: fixed; inset: 0; z-index: 100; display: none; align-items: center; justify-content: center;
  flex-direction: column; padding: 24px; background: rgba(8, 9, 12, 0.94);
}
#lightbox.open { display: flex; }
#lightbox img { max-width: 92vw; max-height: 82vh; border: 1px solid rgba(255,255,255,0.14); }
#lightbox .lb-cap { margin-top: 12px; color: #eef0f6; font-size: 13.5px; text-align: center; }
#lightbox .lb-close, #lightbox .lb-prev, #lightbox .lb-next {
  position: fixed; background: rgba(255,255,255,0.10); color: #fff;
  border: 1px solid rgba(255,255,255,0.16); width: 40px; height: 40px; font-size: 20px; cursor: pointer;
}
#lightbox .lb-close { top: 18px; right: 22px; }
#lightbox .lb-prev { left: 18px; top: 50%; transform: translateY(-50%); }
#lightbox .lb-next { right: 18px; top: 50%; transform: translateY(-50%); }

.menu-btn { display: none; }
.loading { padding: 48px 0; color: var(--fg-faint); font-family: var(--font-mono); font-size: 13px; }
@media (max-width: 1120px) {
  .shell { grid-template-columns: 13.5rem minmax(0, 1fr); gap: 36px; }
  .sidebar-right { display: none; }
}
@media (max-width: 820px) {
  .shell { grid-template-columns: 1fr; padding: 74px 18px 64px; }
  .menu-btn { display: inline-flex; }
  .sidebar-left {
    display: none;
    position: fixed;
    left: 0; top: 56px; bottom: 0; width: 280px; max-height: none;
    z-index: 50; background: var(--bg); padding: 20px; border-right: 1px solid var(--rule);
  }
  .sidebar-left.open { display: block; }
  .pager { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div style="display:flex;align-items:center;gap:12px;">
      <button class="icon-btn menu-btn" id="menuBtn" type="button">☰</button>
      <a class="brand" href="?doc=docs/HANDBOOK.md" data-doc="docs/HANDBOOK.md">
        <svg viewBox="0 0 32 32" width="20" height="20" aria-hidden="true">
          <defs><linearGradient id="asterGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6c5ce7"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient></defs>
          <path fill="url(#asterGrad)" d="M16 3 28 26H21.5L16 14.5 10.5 26H4L16 3Z"/>
        </svg>
        <span>AsterLab</span>
        <span class="brand-sep">/</span>
        <span class="brand-sub">docs</span>
      </a>
    </div>
    <nav class="top-nav">
      <button class="icon-btn" id="searchBtn" type="button">Search <span class="kbd">⌘K</span></button>
      <a class="top-link" id="ghLink" href="https://github.com/LLLin000/AsterLab" target="_blank" rel="noopener">GitHub</a>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="Toggle theme">◐</button>
    </nav>
  </div>
</header>

<div class="shell">
  <aside class="sidebar-left" id="sidebarLeft"></aside>
  <main class="main-col">
    <div class="doc-kicker" id="docKicker">START · OVERVIEW</div>
    <article class="prose" id="docContent"><div class="loading">Loading documentation...</div></article>
    <div class="pager" id="docPager"></div>
  </main>
  <aside class="sidebar-right" id="sidebarRight"></aside>
</div>

<div id="cmdModal">
  <div class="cmd-panel">
    <input class="cmd-input" id="cmdInput" type="search" placeholder="跳转章节或搜索页面..." />
    <div class="cmd-results" id="cmdResults"></div>
  </div>
</div>

<div id="lightbox">
  <button class="lb-close" id="lbClose" type="button">×</button>
  <button class="lb-prev" id="lbPrev" type="button">‹</button>
  <button class="lb-next" id="lbNext" type="button">›</button>
  <img id="lbImg" src="" alt="" />
  <div class="lb-cap" id="lbCap"></div>
</div>

<script src="./docs-bundle.js"></script>
<script>
(() => {
  const OWNER_REPO = "LLLin000/AsterLab";
  const FALLBACK_BRANCH = "feat/v2-generic-modules";

  const NAV_GROUPS = [
    ["Start", [
      ["docs/HANDBOOK.md", "Overview"],
      ["docs/handbook/domain-model.md", "领域模型与科学红线"],
      ["docs/adr/0002-asterml-vault-pure-go-core.md", "ADR-0002 单真源架构决策"],
    ]],
    ["Architecture", [
      ["docs/handbook/architecture.md", "分层架构与代码包"],
      ["docs/handbook/vault-storage.md", "Vault 存储、索引与快照"],
      ["docs/handbook/mobile-and-sync.md", "移动端边界与双端同步"],
    ]],
    ["AsterML SDK", [
      ["docs/handbook/asterml-spec.md", "AsterML 语法与 Parity"],
      ["docs/handbook/modules-content.md", "通用内容模块（11 种）"],
      ["docs/handbook/modules-labware-and-pdf.md", "容器孔板、原语与 PDF"],
    ]],
    ["UI & UX", [
      ["docs/handbook/design-system.md", "Token、色盘与物理动效"],
      ["docs/handbook/liquid-glass.md", "Liquid Glass 材质规范"],
      ["docs/handbook/desktop-workbench.md", "桌面端工作台与分屏"],
      ["docs/handbook/mobile-workspace.md", "移动端单手工作台"],
    ]],
    ["Reference", [
      ["docs/handbook/ffi-and-cli.md", "Pure-Go CLI、深度链接与历史 FFI"],
      ["docs/handbook/verification-and-backlog.md", "自动化门禁与已关闭热点"],
    ]],
  ];

  const FLAT_PAGES = NAV_GROUPS.flatMap(([group, items]) =>
    items.map(([path, title]) => ({ group, path, title }))
  );

  const rootEl = document.documentElement;
  rootEl.setAttribute("data-theme", localStorage.getItem("asterlab-docs-theme") || "light");

  const params = new URLSearchParams(location.search);
  let currentDoc = params.get("doc") || "docs/HANDBOOK.md";

  function normalizeRepoPath(curDocPath, relHref) {
    const baseParts = curDocPath.split("/").slice(0, -1);
    for (const seg of relHref.split("/")) {
      if (!seg || seg === ".") continue;
      if (seg === "..") {
        if (baseParts.length) baseParts.pop();
      } else {
        baseParts.push(seg);
      }
    }
    return baseParts.join("/");
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  }

  function slugify(text) {
    const plain = text
      .replace(/`([^`]*)`/g, "$1")
      .replace(/\[([^\]]+)\]\([^)]+\)/g, "$1")
      .trim()
      .toLowerCase();
    let out = "";
    for (const ch of plain) {
      if (/[a-z0-9\u4e00-\u9fff_-]/i.test(ch)) out += ch;
      else if (ch === " ") out += "-";
    }
    return out.replace(/^-+|-+$/g, "") || "section";
  }

  function resolveLink(href, curDoc) {
    if (!href) return { href: "#", isDoc: false };
    if (/^(https?:|mailto:|#)/i.test(href)) return { href, isDoc: false };
    const hashIdx = href.indexOf("#");
    const pathPart = hashIdx >= 0 ? href.slice(0, hashIdx) : href;
    const frag = hashIdx >= 0 ? href.slice(hashIdx) : "";
    if (!pathPart) return { href: frag || "#", isDoc: false };
    const repoRel = normalizeRepoPath(curDoc, pathPart.replace(/\\/g, "/"));
    if (/\.(png|jpe?g|svg|webp|gif|pdf)$/i.test(repoRel)) {
      return {
        href: `./${repoRel}`,
        fallback: `https://cdn.jsdelivr.net/gh/${OWNER_REPO}@${FALLBACK_BRANCH}/${repoRel}`,
        isDoc: false,
      };
    }
    if (/\.md$/i.test(repoRel)) {
      return { href: `?doc=${encodeURIComponent(repoRel)}${frag}`, repoRel, frag, isDoc: true };
    }
    const ghFrag = /^#L\d+(-L\d+)?$/i.test(frag) ? frag : "";
    return { href: `https://github.com/${OWNER_REPO}/blob/${FALLBACK_BRANCH}/${repoRel}${ghFrag}`, isDoc: false };
  }

  function renderInline(text, curDoc) {
    const tokens = [];
    const stash = (h) => {
      const id = tokens.length;
      tokens.push(h);
      return `\u0000T${id}\u0000`;
    };
    let s = text.replace(/`([^`]+)`/g, (_, code) => stash(`<code>${escapeHtml(code)}</code>`));
    s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (_, alt, url) => {
      const r = resolveLink(url.trim(), curDoc);
      const eAlt = escapeHtml(alt);
      const fb = r.fallback ? ` data-fb="${escapeHtml(r.fallback)}"` : "";
      return stash(
        `<figure class="shot" data-zoom="${escapeHtml(r.href)}" data-caption="${eAlt}">` +
        `<img src="${escapeHtml(r.href)}"${fb} alt="${eAlt}" loading="lazy" decoding="async" onerror="if(this.dataset.fb){this.src=this.dataset.fb;this.dataset.fb='';}" />` +
        `<figcaption>${eAlt}</figcaption></figure>`
      );
    });
    s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, label, url) => {
      const r = resolveLink(url.trim(), curDoc);
      if (r.isDoc) {
        return stash(`<a href="${escapeHtml(r.href)}" data-doc="${escapeHtml(r.repoRel)}" data-frag="${escapeHtml(r.frag || "")}">${renderInline(label, curDoc)}</a>`);
      }
      return stash(`<a href="${escapeHtml(r.href)}" target="_blank" rel="noopener noreferrer">${renderInline(label, curDoc)}</a>`);
    });
    s = escapeHtml(s);
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/(?<!\*)\*([^*]+)\*(?!\*)/g, "<em>$1</em>");
    for (let i = 0; i < tokens.length; i++) s = s.replace(`\u0000T${i}\u0000`, tokens[i]);
    return s;
  }

  function parseTableRow(line) {
    let s = line.trim();
    if (s.startsWith("|")) s = s.slice(1);
    if (s.endsWith("|")) s = s.slice(0, -1);
    return s.split("|").map((c) => c.trim());
  }

  function renderMarkdown(md, curDoc) {
    const lines = md.replace(/\r\n/g, "\n").split("\n");
    const out = [];
    const toc = [];
    const slugCounts = {};
    const uniqueSlug = (raw) => {
      const base = slugify(raw);
      const c = slugCounts[base] || 0;
      slugCounts[base] = c + 1;
      return c === 0 ? base : `${base}-${c}`;
    };

    function parseList(start) {
      let i = start;
      const baseIndent = lines[i].length - lines[i].trimStart().length;
      const isOrd = /^\s*\d+\.\s+/.test(lines[i]);
      const tag = isOrd ? "ol" : "ul";
      const items = [];
      while (i < lines.length) {
        const line = lines[i];
        if (!line.trim()) {
          let j = i + 1;
          while (j < lines.length && !lines[j].trim()) j++;
          if (j < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[j])) {
            const nxt = lines[j].length - lines[j].trimStart().length;
            if (nxt >= baseIndent) { i = j; continue; }
          }
          break;
        }
        const m = line.match(/^(\s*)([-*]|\d+\.)\s+(.*)$/);
        if (!m) break;
        const ind = m[1].length;
        if (ind < baseIndent) break;
        if (ind > baseIndent) {
          const [subHtml, nextI] = parseList(i);
          i = nextI;
          if (items.length) items[items.length - 1] = items[items.length - 1].replace(/<\/li>$/, subHtml + "</li>");
          else items.push(`<li>${subHtml}</li>`);
          continue;
        }
        if (/^\d/.test(m[2]) !== isOrd) break;
        let text = m[3].trim();
        i++;
        while (i < lines.length && lines[i].trim() && !/^\s*([-*]|\d+\.)\s+/.test(lines[i]) && !/^(```|#)/.test(lines[i].trim())) {
          const ci = lines[i].length - lines[i].trimStart().length;
          if (ci > baseIndent) { text += " " + lines[i].trim(); i++; } else break;
        }
        items.push(`<li>${renderInline(text, curDoc)}</li>`);
      }
      return [`<${tag}>${items.join("")}</${tag}>`, i];
    }

    let i = 0;
    while (i < lines.length) {
      const iterStart = i;
      const line = lines[i];
      const s = line.trim();
      if (!s) { i++; continue; }
      if (/^[-*_]{3,}$/.test(s)) { out.push("<hr />"); i++; continue; }

      const fence = s.match(/^(`{3,})([^\s`]*)\s*$/);
      if (fence) {
        const fenceTicks = fence[1];
        const lang = (fence[2] || "").toLowerCase();
        i++;
        const buf = [];
        while (i < lines.length && !lines[i].trim().startsWith(fenceTicks)) { buf.push(lines[i]); i++; }
        if (i < lines.length) i++;
        if (lang === "mermaid") {
          out.push(`<div class="mermaid-wrap"><pre class="mermaid">${escapeHtml(buf.join("\n"))}</pre></div>`);
        } else {
          out.push(`<pre><code class="language-${escapeHtml(lang)}">${escapeHtml(buf.join("\n"))}</code></pre>`);
        }
        continue;
      }

      const hm = s.match(/^(#{1,6})\s+(.+)$/);
      if (hm) {
        const lvl = Math.min(hm[1].length, 4);
        const raw = hm[2].trim();
        const slug = uniqueSlug(raw);
        const htmlText = renderInline(raw, curDoc);
        if (lvl === 2 || lvl === 3) {
          toc.push({ level: lvl, id: slug, text: htmlText.replace(/<[^>]+>/g, "") });
        }
        out.push(`<h${lvl} id="${slug}"><a class="anchor" href="#${slug}">#</a>${htmlText}</h${lvl}>`);
        i++;
        continue;
      }

      if (s.startsWith(">")) {
        const bq = [];
        while (i < lines.length && lines[i].trim().startsWith(">")) {
          bq.push(lines[i].trim().replace(/^>\s?/, ""));
          i++;
        }
        let alertType = "";
        if (bq.length) {
          const am = bq[0].match(/^\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\s*(.*)$/i);
          if (am) {
            alertType = am[1].toUpperCase();
            bq.shift();
            if (am[2].trim()) bq.unshift(am[2].trim());
          }
        }
        const inner = bq.filter(Boolean).map((l) => renderInline(l, curDoc)).join("<br />");
        if (alertType) {
          out.push(`<aside class="callout"><div class="callout-title">${alertType}</div><div>${inner}</div></aside>`);
        } else {
          out.push(`<blockquote>${inner}</blockquote>`);
        }
        continue;
      }

      const isTableSep = (ln) => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(ln || "") && (ln || "").includes("|");
      if (s.includes("|") && i + 1 < lines.length && isTableSep(lines[i + 1])) {
        const headers = parseTableRow(lines[i]);
        i += 2;
        const rows = [];
        while (i < lines.length && lines[i].trim() && lines[i].includes("|")) {
          rows.push(parseTableRow(lines[i]));
          i++;
        }
        const isGallery = rows.some((r) => r.some((c) => c.includes("![")));
        if (isGallery) {
          // Convert image tables into crisp responsive figure cards without clunky cell borders
          const figs = [];
          for (const r of rows) {
            for (const c of r) {
              if (c.trim()) figs.push(renderInline(c, curDoc));
            }
          }
          out.push(`<div class="gallery-grid">${figs.join("")}</div>`);
        } else {
          let t = `<div class="table-scroll"><table class="data-table"><thead><tr>`;
          t += headers.map((h) => `<th>${renderInline(h, curDoc)}</th>`).join("");
          t += "</tr></thead><tbody>";
          for (const r of rows) {
            t += "<tr>" + headers.map((_, ci) => `<td>${renderInline(r[ci] || "", curDoc)}</td>`).join("") + "</tr>";
          }
          t += "</tbody></table></div>";
          out.push(t);
        }
        continue;
      }

      if (/^\s*([-*]|\d+\.)\s+/.test(line)) {
        const [lh, nextI] = parseList(i);
        i = nextI > i ? nextI : i + 1;
        out.push(lh);
        continue;
      }

      const p = [];
      while (i < lines.length) {
        const c = lines[i];
        const cs = c.trim();
        if (p.length > 0 && (!cs || /^(#{1,6}\s+|`{3,}|>|[-*_]{3,}$)/.test(cs) || /^\s*([-*]|\d+\.)\s+/.test(c) || (cs.includes("|") && i + 1 < lines.length && isTableSep(lines[i + 1])))) break;
        p.push(cs);
        i++;
      }
      if (i === iterStart) i++;
      if (p.length) out.push(`<p>${p.map((x) => renderInline(x, curDoc)).join(" ")}</p>`);
    }
    return { html: out.join("\n"), toc };
  }

  let shots = [];
  let lbIdx = -1;
  const lb = document.getElementById("lightbox");
  const lbImg = document.getElementById("lbImg");
  const lbCap = document.getElementById("lbCap");
  function openLb(idx) {
    if (idx < 0 || idx >= shots.length) return;
    lbIdx = idx;
    lbImg.src = shots[idx].url;
    lbCap.textContent = `${shots[idx].caption} (${idx + 1}/${shots.length})`;
    lb.classList.add("open");
  }

  function renderSidebars(toc) {
    const left = document.getElementById("sidebarLeft");
    let lh = `<div class="sidebar-eyebrow">Documentation</div>`;
    for (const [groupName, items] of NAV_GROUPS) {
      lh += `<div class="nav-group"><div class="nav-group-title">${escapeHtml(groupName)}</div><ul class="nav-list">`;
      for (const [docPath, label] of items) {
        const cls = docPath === currentDoc ? "active" : "";
        lh += `<li class="nav-item"><a class="${cls}" href="?doc=${encodeURIComponent(docPath)}" data-doc="${docPath}">${escapeHtml(label)}</a></li>`;
      }
      lh += `</ul></div>`;
    }
    left.innerHTML = lh;

    const right = document.getElementById("sidebarRight");
    if (toc.length) {
      let rh = `<div class="sidebar-eyebrow">On this page</div><ul class="toc-list">`;
      for (const item of toc) {
        rh += `<li class="toc-item lvl-${item.level}"><a href="#${item.id}" data-toc="${item.id}">${escapeHtml(item.text)}</a></li>`;
      }
      rh += `</ul>`;
      right.innerHTML = rh;
    } else {
      right.innerHTML = "";
    }

    const idx = FLAT_PAGES.findIndex((p) => p.path === currentDoc);
    const kicker = idx >= 0 ? `${FLAT_PAGES[idx].group.toUpperCase()} · ${FLAT_PAGES[idx].title}` : currentDoc;
    document.getElementById("docKicker").textContent = kicker;

    const pager = document.getElementById("docPager");
    let ph = "";
    if (idx > 0) {
      const prev = FLAT_PAGES[idx - 1];
      ph += `<a class="pager-card" href="?doc=${encodeURIComponent(prev.path)}" data-doc="${prev.path}"><div class="pager-dir">← Previous</div><div class="pager-title">${escapeHtml(prev.title)}</div></a>`;
    } else {
      ph += `<div></div>`;
    }
    if (idx >= 0 && idx < FLAT_PAGES.length - 1) {
      const next = FLAT_PAGES[idx + 1];
      ph += `<a class="pager-card next" href="?doc=${encodeURIComponent(next.path)}" data-doc="${next.path}"><div class="pager-dir">Next →</div><div class="pager-title">${escapeHtml(next.title)}</div></a>`;
    }
    pager.innerHTML = ph;
  }

  const docCache = new Map();
  const inflightFetch = new Map();
  const bundledDocs = (window.__ASTERLAB_DOCS__ && typeof window.__ASTERLAB_DOCS__ === "object") ? window.__ASTERLAB_DOCS__ : null;
  let loadToken = 0;

  function getCachedOrBundled(docPath) {
    if (docCache.has(docPath)) return docCache.get(docPath);
    if (bundledDocs && Object.prototype.hasOwnProperty.call(bundledDocs, docPath)) {
      const mdText = bundledDocs[docPath];
      const parsed = renderMarkdown(mdText, docPath);
      const entry = { mdText, html: parsed.html, toc: parsed.toc };
      docCache.set(docPath, entry);
      return entry;
    }
    return null;
  }

  async function fetchMarkdown(docPath) {
    const syncEntry = getCachedOrBundled(docPath);
    if (syncEntry) return syncEntry;
    if (inflightFetch.has(docPath)) return inflightFetch.get(docPath);
    const p = (async () => {
      let resp = await fetch(`./${docPath}`);
      if (!resp.ok) {
        resp = await fetch(`https://raw.githubusercontent.com/${OWNER_REPO}/${FALLBACK_BRANCH}/${docPath}`);
      }
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const mdText = await resp.text();
      const parsed = renderMarkdown(mdText, docPath);
      const entry = { mdText, html: parsed.html, toc: parsed.toc };
      docCache.set(docPath, entry);
      return entry;
    })();
    inflightFetch.set(docPath, p);
    try {
      return await p;
    } finally {
      inflightFetch.delete(docPath);
    }
  }

  function prefetchDoc(docPath) {
    if (!docPath || getCachedOrBundled(docPath) || inflightFetch.has(docPath)) return;
    fetchMarkdown(docPath).catch(() => {});
  }

  function prefetchNeighbors(docPath) {
    const idx = FLAT_PAGES.findIndex((p) => p.path === docPath);
    if (idx < 0) return;
    const warm = () => {
      if (idx + 1 < FLAT_PAGES.length) prefetchDoc(FLAT_PAGES[idx + 1].path);
      if (idx - 1 >= 0) prefetchDoc(FLAT_PAGES[idx - 1].path);
    };
    if ("requestIdleCallback" in window) requestIdleCallback(warm, { timeout: 1500 });
    else setTimeout(warm, 350);
  }

  async function loadDoc(docPath, frag = "") {
    const reqId = ++loadToken;
    currentDoc = docPath;
    document.getElementById("ghLink").href = `https://github.com/${OWNER_REPO}/blob/${FALLBACK_BRANCH}/${currentDoc}`;

    let entry = getCachedOrBundled(currentDoc);
    if (!entry) {
      try {
        entry = await fetchMarkdown(currentDoc);
      } catch (err) {
        if (reqId !== loadToken) return;
        document.getElementById("docContent").innerHTML = `<aside class="callout"><div class="callout-title">Not Found</div><div>无法读取 <code>${escapeHtml(currentDoc)}</code> (${escapeHtml(String(err))})</div></aside>`;
        renderSidebars([]);
        return;
      }
    }
    if (reqId !== loadToken) return;

    document.getElementById("docContent").innerHTML = entry.html;
    renderSidebars(entry.toc);

    const h1 = document.querySelector("#docContent h1");
    document.title = h1 ? `${h1.textContent.replace(/^#\s*/, "")} — AsterLab` : "Docs — AsterLab";

    shots = [...document.querySelectorAll("figure.shot")].map((fig, idx) => {
      fig.addEventListener("click", () => openLb(idx));
      return { url: fig.getAttribute("data-zoom"), caption: fig.getAttribute("data-caption") || "" };
    });

    if (frag) {
      const target = document.getElementById(decodeURIComponent(frag.slice(1)));
      if (target) target.scrollIntoView();
    } else {
      window.scrollTo({ top: 0 });
    }
    if (window.__renderMermaid) window.__renderMermaid();
    prefetchNeighbors(currentDoc);
  }

  // Hover/focus prefetch on any internal markdown link for instant navigation
  document.addEventListener("pointerenter", (e) => {
    const a = e.target.closest && e.target.closest("a[data-doc]");
    if (a) prefetchDoc(a.getAttribute("data-doc"));
  }, true);

  // Scroll-spy for right TOC (RAF-throttled)
  let scrollRafPending = false;
  window.addEventListener("scroll", () => {
    if (scrollRafPending) return;
    scrollRafPending = true;
    requestAnimationFrame(() => {
      scrollRafPending = false;
      const headings = [...document.querySelectorAll("#docContent h2, #docContent h3")];
      if (!headings.length) return;
      let activeId = headings[0].id;
      for (const h of headings) {
        if (h.getBoundingClientRect().top <= 110) activeId = h.id;
      }
      document.querySelectorAll(".toc-item a").forEach((a) => {
        a.classList.toggle("active", a.getAttribute("data-toc") === activeId);
      });
    });
  }, { passive: true });

  document.addEventListener("click", (e) => {
    const a = e.target.closest("a[data-doc]");
    if (!a) return;
    e.preventDefault();
    const doc = a.getAttribute("data-doc");
    const frag = a.getAttribute("data-frag") || "";
    history.pushState({ doc }, "", `?doc=${encodeURIComponent(doc)}${frag}`);
    document.getElementById("sidebarLeft").classList.remove("open");
    loadDoc(doc, frag);
  });

  window.addEventListener("popstate", () => {
    const p = new URLSearchParams(location.search);
    loadDoc(p.get("doc") || "docs/HANDBOOK.md", location.hash);
  });

  document.getElementById("themeBtn").addEventListener("click", () => {
    const next = rootEl.getAttribute("data-theme") === "dark" ? "light" : "dark";
    rootEl.setAttribute("data-theme", next);
    localStorage.setItem("asterlab-docs-theme", next);
  });
  document.getElementById("menuBtn").addEventListener("click", () => {
    document.getElementById("sidebarLeft").classList.toggle("open");
  });

  // Search Modal (Cmd/Ctrl+K)
  const cmdModal = document.getElementById("cmdModal");
  const cmdInput = document.getElementById("cmdInput");
  const cmdResults = document.getElementById("cmdResults");
  function renderSearch(q) {
    const needle = q.trim().toLowerCase();
    const hits = [];
    for (const p of FLAT_PAGES) {
      const metaMatch = !needle || p.title.toLowerCase().includes(needle) || p.group.toLowerCase().includes(needle) || p.path.toLowerCase().includes(needle);
      let snippet = "";
      if (needle && !metaMatch) {
        const raw = (docCache.get(p.path)?.mdText) || (bundledDocs ? bundledDocs[p.path] : "") || "";
        const idx = raw.toLowerCase().indexOf(needle);
        if (idx < 0) continue;
        const start = Math.max(0, idx - 24);
        snippet = raw.slice(start, Math.min(raw.length, idx + needle.length + 38)).replace(/\s+/g, " ").trim();
      }
      hits.push({ ...p, snippet });
    }
    cmdResults.innerHTML = hits.map((p) => {
      const sub = p.snippet ? `<div style="font-size:11.5px;color:var(--fg-faint);margin-top:2px;">…${escapeHtml(p.snippet)}…</div>` : "";
      return `<div class="cmd-item" data-jump="${p.path}"><div><div>${escapeHtml(p.title)}</div>${sub}</div><span class="cmd-group">${escapeHtml(p.group)}</span></div>`;
    }).join("");
  }
  const openSearch = () => {
    cmdModal.classList.add("open");
    cmdInput.value = "";
    renderSearch("");
    cmdInput.focus();
  };
  document.getElementById("searchBtn").addEventListener("click", openSearch);
  cmdModal.addEventListener("click", (e) => { if (e.target === cmdModal) cmdModal.classList.remove("open"); });
  cmdInput.addEventListener("input", () => renderSearch(cmdInput.value));
  cmdResults.addEventListener("click", (e) => {
    const row = e.target.closest("[data-jump]");
    if (!row) return;
    const doc = row.getAttribute("data-jump");
    cmdModal.classList.remove("open");
    history.pushState({ doc }, "", `?doc=${encodeURIComponent(doc)}`);
    loadDoc(doc);
  });

  const closeLb = () => lb.classList.remove("open");
  document.getElementById("lbClose").addEventListener("click", closeLb);
  document.getElementById("lbPrev").addEventListener("click", () => openLb((lbIdx - 1 + shots.length) % shots.length));
  document.getElementById("lbNext").addEventListener("click", () => openLb((lbIdx + 1) % shots.length));
  lb.addEventListener("click", (e) => { if (e.target === lb) closeLb(); });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { closeLb(); cmdModal.classList.remove("open"); }
    if (lb.classList.contains("open")) {
      if (e.key === "ArrowLeft") openLb((lbIdx - 1 + shots.length) % shots.length);
      if (e.key === "ArrowRight") openLb((lbIdx + 1) % shots.length);
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
      e.preventDefault();
      if (cmdModal.classList.contains("open")) cmdModal.classList.remove("open");
      else openSearch();
    }
  });

  loadDoc(currentDoc, location.hash);
})();
</script>
<script>
(() => {
  let mermaidPromise = null;
  function loadMermaid() {
    if (window.mermaid) return Promise.resolve(window.mermaid);
    if (!mermaidPromise) {
      mermaidPromise = new Promise((resolve) => {
        const sc = document.createElement("script");
        sc.src = "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js";
        sc.async = true;
        sc.onload = () => resolve(window.mermaid || null);
        sc.onerror = () => resolve(null);
        document.head.appendChild(sc);
      });
    }
    return mermaidPromise;
  }
  window.__renderMermaid = async () => {
    const nodes = document.querySelectorAll(".mermaid:not([data-processed])");
    if (!nodes.length) return;
    const mermaid = await loadMermaid();
    if (!mermaid) return;
    const dark = document.documentElement.getAttribute("data-theme") === "dark";
    mermaid.initialize({ startOnLoad: false, theme: dark ? "dark" : "neutral" });
    await mermaid.run({ nodes });
  };
  window.__renderMermaid();
})();
</script>
</body>
</html>
