name: linux-tests

# REL-04 Linux gate. L0 compiles every Rust target the VPS owns, L1 runs the
# unit/integration suites from HANDOFF-VPS.md §3. Toolchain and build matrix:
# docs/engineering/cross-platform-builds.md §3-5.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-tests:
    name: linux-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        # rusqlite is built with the bundled feature; the PDF test needs a CJK
        # font (HANDOFF-VPS.md §2).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev fonts-droid-fallback

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target directories
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            crates/asterlab-core -> target
            crates/asterlab-app -> target

      - name: Record toolchain versions
        run: |
          rustc --version
          cargo --version
          cc --version | sed -n 1p

      - name: L0 build
        run: |
          cargo build --locked --bin labworkbench
          cargo build --locked --manifest-path crates/asterlab-core/Cargo.toml
          cargo build --locked --manifest-path crates/asterlab-app/Cargo.toml

      - name: L1 tests
        run: |
          cargo test --locked --bin labworkbench
          cargo test --locked --manifest-path crates/asterlab-core/Cargo.toml
          cargo test --locked --manifest-path crates/asterlab-app/Cargo.toml

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          # go 1.27.3, the pin in HANDOFF-VPS.md §2 and go.mod.
          go-version-file: prototypes/mygo-run/go.mod
          cache-dependency-path: prototypes/mygo-run/go.sum

      - name: Native generator hashes (two Linux generations)
        # REL-05: the committed MyGo binding output must hash identically on
        # Linux and Windows, and the pinned MyGo must regenerate it byte for
        # byte. Contract and golden file: scripts/ci/native_generator_hash.py,
        # scripts/ci/native_generator_hashes.json.
        run: |
          python3 scripts/ci/test_native_generator_hash.py
          python3 scripts/ci/native_generator_hash.py --check
          python3 scripts/ci/native_generator_hash.py --regen 2
      - name: Go tests
        working-directory: prototypes/mygo-run
        run: go test ./...
