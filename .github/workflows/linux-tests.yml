name: linux-tests

# REL-04 Linux gate. L0 compiles every Rust target the VPS owns, L1 runs the
# unit/integration suites from HANDOFF-VPS.md §3. Toolchain and build matrix:
# docs/engineering/cross-platform-builds.md §3-5.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-tests:
    name: linux-tests
    runs-on: [self-hosted, asterlab-vps]
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decide scope
        # Docs-only pull requests skip the Rust/Go gate; every code path still
        # runs it. An unreadable diff falls back to running the full gate.
        run: |
          set -euo pipefail
          changed=""
          if [ -n "${{ github.base_ref }}" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}" || true
            changed=$(git diff --name-only "FETCH_HEAD...HEAD" 2>/dev/null || true)
          else
            changed=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || true)
          fi
          if [ -z "$changed" ]; then
            echo "RUN_HEAVY=1" >> "$GITHUB_ENV"
            echo "no diff detected; running the full gate"
          elif printf '%s\n' "$changed" | grep -Eq '^(src/|crates/|prototypes/|scripts/|tests/|Cargo\.(toml|lock)$|rust-toolchain\.toml|\.github/workflows/)'; then
            echo "RUN_HEAVY=1" >> "$GITHUB_ENV"
            echo "code change detected; running the full gate"
          else
            echo "RUN_HEAVY=0" >> "$GITHUB_ENV"
            echo "docs-only change; heavy steps skipped"
          fi

      - name: Install system dependencies
        if: env.RUN_HEAVY == '1'
        # rusqlite is built with the bundled feature; the PDF test needs a CJK
        # font (HANDOFF-VPS.md §2).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev fonts-droid-fallback

      - name: Install Rust toolchain
        if: env.RUN_HEAVY == '1'
        # The channel lives only in rust-toolchain.toml (REL-07). `rustup install`
        # resolves that file and installs exactly that toolchain; a missing or
        # malformed pin fails here instead of silently using the runner's stable.
        run: rustup install --profile minimal --no-self-update

      - name: Cache cargo registry and target directories
        if: env.RUN_HEAVY == '1'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            crates/asterlab-core -> target
            crates/asterlab-app -> target

      - name: Record toolchain versions
        if: env.RUN_HEAVY == '1'
        run: |
          rustc --version
          cargo --version
          cc --version | sed -n 1p

      - name: L0 build
        if: env.RUN_HEAVY == '1'
        run: |
          cargo build --locked --bin labworkbench
          cargo build --locked --manifest-path crates/asterlab-core/Cargo.toml
          cargo build --locked --manifest-path crates/asterlab-app/Cargo.toml

      - name: L1 tests
        if: env.RUN_HEAVY == '1'
        run: |
          cargo test --locked --bin labworkbench
          cargo test --locked --manifest-path crates/asterlab-core/Cargo.toml
          cargo test --locked --manifest-path crates/asterlab-app/Cargo.toml

      - name: Install Go
        if: env.RUN_HEAVY == '1'
        uses: actions/setup-go@v5
        with:
          # go 1.27.3, the pin in HANDOFF-VPS.md §2 and go.mod.
          go-version-file: prototypes/mygo-run/go.mod
          cache-dependency-path: prototypes/mygo-run/go.sum

      - name: Native generator hashes (two Linux generations)
        if: env.RUN_HEAVY == '1'
        # REL-05: the committed MyGo binding output must hash identically on
        # Linux and Windows, and the pinned MyGo must regenerate it byte for
        # byte. Contract and golden file: scripts/ci/native_generator_hash.py,
        # scripts/ci/native_generator_hashes.json.
        run: |
          python3 scripts/ci/test_native_generator_hash.py
          python3 scripts/ci/native_generator_hash.py --check
          python3 scripts/ci/native_generator_hash.py --regen 2
      - name: Build native Runs module
        if: env.RUN_HEAVY == '1'
        working-directory: prototypes/mygo-run
        run: go run github.com/egoist/mygo/cmd/mygo@v0.8.4-0.20261108220316-c4197b7fe562 native build -target host ./modules/runs
      - name: Record Linux Go build evidence
        if: env.RUN_HEAVY == '1'
        working-directory: prototypes/mygo-run
        run: |
          go version
          git -C ../.. rev-parse HEAD
          sha256sum .mygo/native/linux-amd64/libRuns.so
      - name: Go tests
        if: env.RUN_HEAVY == '1'
        working-directory: prototypes/mygo-run
        run: go test ./...
