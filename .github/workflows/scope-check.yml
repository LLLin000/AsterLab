name: scope-check

# REL-04: a pull request may only touch paths the Kandev card lists under
# `write:` in its `<!-- kandev-scope -->` block. The description comes from the
# Kandev API when KANDEV_API_URL/KANDEV_API_TOKEN are configured and the PR body
# carries `<!-- kandev-task: <uuid> -->`; otherwise the scope block is read from
# the PR body, with a notice in the log. Contract: scripts/ci/README.md.
#
# Also validates the workflow YAML itself, so a broken CI file fails here.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope-check:
    name: scope-check
    # The VPS host is the only self-hosted Linux runner in the repo.
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --prune origin \
            "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"

      - name: Install pinned actionlint
        run: |
          scripts/ci/install-actionlint.sh "${RUNNER_TEMP}/actionlint-bin"
          echo "${RUNNER_TEMP}/actionlint-bin" >> "${GITHUB_PATH}"

      - name: Validate workflow YAML
        run: actionlint

      - name: Scope parser selftest
        run: python3 scripts/ci/test_scope_check.py

      - name: Enforce card scope on the diff
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
          KANDEV_API_URL: ${{ secrets.KANDEV_API_URL }}
          KANDEV_API_TOKEN: ${{ secrets.KANDEV_API_TOKEN }}
        run: |
          set -o pipefail
          body_file="${RUNNER_TEMP}/pr-body.md"
          printf '%s' "$PR_BODY" > "$body_file"
          status=0
          python3 scripts/ci/scope_check.py \
            --pr-body-file "$body_file" \
            --base "origin/${BASE_REF}" \
            --head HEAD > scope-check.log 2>&1 || status=$?
          cat scope-check.log
          {
            echo '## scope-check'
            echo '```text'
            cat scope-check.log
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          exit "$status"
